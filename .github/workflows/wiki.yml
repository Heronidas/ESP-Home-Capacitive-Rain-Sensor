name: Wiki
on:
  push:
    branches: [main]
    paths: ["docs/wiki/**", "tools/wiki_sync.py", ".github/workflows/wiki.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone wiki
        run: git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git" wiki
      - name: Copy docs/wiki
        run: python3 tools/wiki_sync.py docs/wiki wiki "${{ github.repository }}"
      - name: Push
        working-directory: wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -m "Sync from docs/wiki (${GITHUB_SHA::7})"; git push; }
