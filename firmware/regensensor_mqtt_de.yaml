# RC-SPC1KA capacitive rain sensor on rain-sensor-board (ESP32-WROOM-32E, ESPHome).
# Standalone variant: local web page and MQTT (Home Assistant discovery,
# FHEM, ioBroker, ...), no Home Assistant API. Hardware: ../README.md.
# secrets.yaml needs wifi_ssid, wifi_password, regensensor_ota_password,
# mqtt_broker, mqtt_username, mqtt_password.
# Calibrate: read the dry "Frequenz", enter it as "Trockenfrequenz", then tune thresholds.

substitutions:
  name: regensensor
  friendly_name: Regensensor

  pin_i2c_sda: GPIO21
  pin_i2c_scl: GPIO22
  pin_heizung: GPIO13    # boost enable + heater MOSFET
  gpio_c_freq: GPIO25    # oscillator input (hardware PCNT)
  pin_ntc: GPIO34        # GPIO32 if solder jumper SJ1 is moved
  pin_batt_adc: GPIO35   # J1 BAT via 100k/100k divider

  batt_teiler_faktor: "2.0"

  # NTC divider: 3V3 --[r_pullup]-- ADC --[NTC]-- GND. Permanently on 3V3
  # (0.87 mA with 2x 5.6k parallel); change only if R2/R3 differ.
  r_pullup: "2800"
  # ADC gain trim. Compare against a reference thermometer (same air, no sun,
  # heater off >= 30 min), then adjust; keep "NTC Offset" at 0.
  adc_faktor: "1.0"

  # Plausible NTC range; outside = fault, heater off (open wire / short).
  ntc_r_min: "80"        # ~108 C
  ntc_r_max: "13000"     # ~-29 C
  temp_aus: "45.0"       # heater off
  temp_ein: "40.0"       # heater may switch on again

  # Capacitance: C = Trockenfrequenz * 100 / f (dry frequency = 100 pF).
  # The runtime number "Trockenfrequenz" overrides this start value.
  # 13549 Hz is a placeholder from the vendor example, measure your own.
  c_freq_referenz_start: "13549.0"
  c_nass_max: "5000.0"   # pF, used when the oscillator stops (0 Hz)

  # Precipitation: rise thresholds are runtime numbers ("Niesel Erkennung",
  # "Regen Erkennung"; dew and fog rise a few pF/min). Below rate_ruhig the
  # level counts as steady for "Regenende nach".
  rate_ruhig: "10"       # pF/min
  # No drizzle from the rise this long after heating: the warm plate takes up
  # humidity again at up to ~30 pF/min.
  niesel_sperre_s: "420"
  # After a rain end the heater dries the surface. Still at the rain level
  # after this many seconds of drying = still raining, rain is set again.
  regen_heiztest: "180"  # s

  # Hysteresis against flicker: the display state falls back below 95 % of its threshold.
  hyst_faktor: "0.95"
  # The heater runs down to this share of the heating threshold: fewer, longer pulses.
  hyst_heizung: "0.85"

  zeitzone: Europe/Berlin   # SNTP time zone

  # Weather state texts; index stored across sleep (see on_boot).
  wl_namen: '"trocken", "nass", "Niesel", "Regen"'

  # Night mode (deep sleep, RTC timer wake).
  schlaf_intervall: 5min
  schlaf_wachzeit: "35000"      # ms awake before sleeping


esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  # After a wake from night mode, report the last weather state at once
  # instead of "unknown" until the first measurement.
  on_boot:
    priority: -100
    then:
      - lambda: |-
          static const char *const N[] = {${wl_namen}};
          int i = id(g_lage);
          if (i >= 0 && i < (int)(sizeof(N) / sizeof(N[0]))) id(wetterlage).publish_state(N[i]);

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

# Deep sleep: no birth/will/shutdown message, so subscribers and HA keep the
# last (retained) states instead of showing the device offline while asleep.
mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  discovery: true
  discovery_retain: true
  birth_message:
  will_message:
  shutdown_message:
  log_topic:

# Local web page: states, settings and OTA upload; works without internet.
web_server:
  port: 80
  version: 3
  local: true

ota:
  - platform: esphome
    password: !secret regensensor_ota_password
    on_begin:
      then:
        - deep_sleep.prevent: nachtschlaf
  - platform: web_server
    on_begin:
      then:
        - deep_sleep.prevent: nachtschlaf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: light
  ap:
    ssid: "${friendly_name} Fallback"

captive_portal:

# Night window needs valid time; without it the device never sleeps.
time:
  - platform: sntp
    id: uhr
    timezone: ${zeitzone}

# Sleep is triggered only by the interval at the bottom.
deep_sleep:
  id: nachtschlaf
  sleep_duration: ${schlaf_intervall}

i2c:
  sda: ${pin_i2c_sda}
  scl: ${pin_i2c_scl}
  scan: true
  frequency: 100kHz

# restore_value goes to NVS flash; synced every 15 min and before deep sleep.
preferences:
  flash_write_interval: 15min

globals:
  # Previous capacitance for the rate; persisted across sleep.
  - id: c_vorher
    type: float
    restore_value: true
    initial_value: 'NAN'

  # Heater account in seconds: rises while heating, decays in pauses.
  # Persisted, otherwise the limit cannot act across night-mode wakeups.
  - id: g_heiz_sek
    type: float
    restore_value: true
    initial_value: '0.0'

  # Remaining lockout in seconds.
  - id: g_sperre_sek
    type: uint32_t
    restore_value: true
    initial_value: '0'

  # Unix time of the last capacitance sample (millis() restarts after sleep).
  - id: g_rate_stamp
    type: uint32_t
    restore_value: true
    initial_value: '0'

  # Precipitation latches (set by a fast rise, see the control loop), so dew
  # is not reported as rain and the heater stays off while it rains.
  - id: g_regen
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: g_niesel
    type: bool
    restore_value: true
    initial_value: 'false'
  # Rain released by "Regenende nach" while still above the rain level: only
  # a new fast rise or the heater test sets it again.
  - id: g_regen_ende
    type: bool
    restore_value: true
    initial_value: 'false'
  # Unix time since the level is steady (0 = rising).
  - id: g_ruhig_seit
    type: uint32_t
    restore_value: true
    initial_value: '0'
  # Seconds of drying after a rain end (heater test).
  - id: g_trocknen_sek
    type: float
    initial_value: '0.0'

  # Unix time of the last control-loop run (account and lockout use real time).
  - id: g_konto_stamp
    type: uint32_t
    restore_value: true
    initial_value: '0'

  # Held states behind the hysteresis (see hyst_* above).
  - id: g_anz          # capacitance at or above the display threshold
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: g_feucht       # capacitance at or above the heating threshold
    type: bool
    restore_value: true
    initial_value: 'false'

  # Last published weather state (index into wl_namen, -1 = none).
  - id: g_lage
    type: int
    restore_value: true
    initial_value: '-1'

  # Unix time of the last loop run with the heater on (drizzle pause).
  - id: g_heiz_ts
    type: uint32_t
    restore_value: true
    initial_value: '0'

  # Oscillator stalled (0 Hz or c at or above c_nass_max): leakage, not a reading.
  - id: g_steht
    type: bool
    initial_value: 'false'

  # Last known "inside night window", fallback when the clock is missing.
  - id: g_nacht
    type: bool
    restore_value: true
    initial_value: 'false'


# Runtime thresholds; initial_value applies only on the first boot.
# Start values from measurements: dry 100, dew ~105-120 (cloudy night) to
# ~170-200 (clear night), spray mist ~270, three drops ~290, heavy spray ~600,
# soaked cloth 870-1240 pF. The sensor reacts to humid air before water lies
# on it: keep the display threshold above a humid night without dew.
number:
  # Dry frequency of your setup = 100 pF. Read "Frequenz" with a completely
  # dry surface and enter the mean here. "Kapazität" stays NAN without it.
  - platform: template
    name: "Trockenfrequenz"
    id: freq_referenz
    unit_of_measurement: "Hz"
    min_value: 1000
    max_value: 30000
    step: 1
    initial_value: ${c_freq_referenz_start}
    <<: &number_cfg
      restore_value: true
      optimistic: true
      mode: box
      entity_category: config

  # From here the weather state shows "nass".
  - platform: template
    name: "Anzeigeschwelle"
    id: schwelle_anzeige
    unit_of_measurement: "pF"
    min_value: 100
    max_value: 1500
    step: 10
    initial_value: 110
    <<: *number_cfg

  # VEML7700 sits behind a cover; this compensates for its attenuation.
  # No precise measurement exists, so tune against a known outdoor lux value.
  - platform: template
    name: "Glasfaktor"
    id: glasfaktor
    unit_of_measurement: "x"
    min_value: 1
    max_value: 5
    step: 0.1
    initial_value: 1.6
    <<: *number_cfg

  # From here the automation heats ("Feucht" turns on), unless it rains or drizzles.
  - platform: template
    name: "Feuchtigkeitsschwelle"
    id: schwelle_feucht
    unit_of_measurement: "pF"
    min_value: 100
    max_value: 1500
    step: 10
    initial_value: 200
    <<: *number_cfg

  # Rain level: rain needs this level plus a fast rise ("Regen Erkennung") or drizzle.
  - platform: template
    name: "Regenschwelle"
    id: schwelle_regen
    unit_of_measurement: "pF"
    min_value: 200
    max_value: 5000
    step: 50
    initial_value: 500
    <<: *number_cfg

  # Rise that counts as precipitation; also blocks the heater.
  - platform: template
    name: "Niesel Erkennung"
    id: rate_niesel
    unit_of_measurement: "pF/min"
    min_value: 5
    max_value: 500
    step: 1
    initial_value: 18
    <<: *number_cfg

  - platform: template
    name: "Regen Erkennung"
    id: rate_regen
    unit_of_measurement: "pF/min"
    min_value: 20
    max_value: 1000
    step: 10
    initial_value: 150
    <<: *number_cfg

  # Drizzle and rain end after this long without a rise.
  - platform: template
    name: "Regenende nach"
    id: regenende_min
    unit_of_measurement: "min"
    min_value: 1
    max_value: 60
    step: 1
    initial_value: 7
    <<: *number_cfg

  # Heating limit against continuous fog/drizzle.
  - platform: template
    name: "Max. Heizdauer"
    id: max_heizdauer
    unit_of_measurement: "min"
    min_value: 5
    max_value: 30
    step: 1
    initial_value: 15
    <<: *number_cfg

  # Night window in half hours (22.5 = 22:30), may span midnight. Equal values = never sleep.
  - platform: template
    name: "Nachtmodus von"
    id: schlaf_von
    unit_of_measurement: "Uhr"
    min_value: 0
    max_value: 23.5
    step: 0.5
    initial_value: 22
    <<: *number_cfg

  - platform: template
    name: "Nachtmodus bis"
    id: schlaf_bis
    unit_of_measurement: "Uhr"
    min_value: 0
    max_value: 23.5
    step: 0.5
    initial_value: 5
    <<: *number_cfg

  # Pause minutes per heating minute: duty limit 1/(1+x), 6 -> 14 %.
  - platform: template
    name: "Pause je Heizminute"
    id: erholung
    unit_of_measurement: "min"
    min_value: 1
    max_value: 20
    step: 1
    initial_value: 6
    <<: *number_cfg

  - platform: template
    name: "Heizpause"
    id: abklingzeit
    unit_of_measurement: "min"
    min_value: 30
    max_value: 1440
    step: 30
    initial_value: 120
    <<: *number_cfg

  # Fine trim of the surface temperature (coarse: adc_faktor). Calibrate
  # against air temperature in the daytime: at night the plate is colder.
  - platform: template
    name: "NTC Offset"
    id: ntc_offset
    unit_of_measurement: "K"
    min_value: -5
    max_value: 5
    step: 0.1
    initial_value: 0
    <<: *number_cfg


sensor:
  # I2C sensors at 8 s so they report within the 35 s night-mode wake time.
  - platform: veml7700
    address: 0x10
    update_interval: 8s
    ambient_light:
      name: "Helligkeit"
      id: helligkeit
      accuracy_decimals: 1
      filters:
        - lambda: |-
            return isnan(x) ? x : x * id(glasfaktor).state;

  # Rough lux -> W/m2 for daylight; not used by the classification.
  - platform: template
    name: "Sonneneinstrahlung"
    unit_of_measurement: "W/m²"
    device_class: irradiance
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 15s
    lambda: |-
      if (isnan(id(helligkeit).state)) return NAN;
      return id(helligkeit).state * 0.01;

  # HTU21D inside the enclosure: battery climate (no charging below 0 °C)
  # and desiccant check.
  - platform: htu21d
    address: 0x40
    update_interval: 8s
    temperature:
      name: "Box Temperatur"
      entity_category: diagnostic
      accuracy_decimals: 1
    humidity:
      name: "Box Luftfeuchte"
      entity_category: diagnostic
      accuracy_decimals: 1

  # NTC chain: ADC -> resistance -> temperature.
  - platform: adc
    pin: ${pin_ntc}
    id: ntc_adc
    attenuation: 12db
    update_interval: 1s
    internal: true
    samples: 16
    filters:
      - multiply: ${adc_faktor}
      - median:
          window_size: 3
          send_every: 1
      # ~3 s time constant: display lags ~1 K while heating.
      - exponential_moving_average:
          alpha: 0.3
          send_every: 1

  # Battery voltage (Waveshare Solar Power Manager D) on J1 BAT.
  - platform: adc
    pin: ${pin_batt_adc}
    attenuation: 12db
    update_interval: 30s
    samples: 16
    filters:
      - multiply: ${batt_teiler_faktor}
      - exponential_moving_average:
          alpha: 0.2
          send_every: 1
    name: "Batteriespannung"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 2
    entity_category: diagnostic

  - platform: resistance
    sensor: ntc_adc
    id: ntc_widerstand
    name: "NTC Widerstand"
    configuration: DOWNSTREAM
    resistor: ${r_pullup}Ohm
    reference_voltage: 3.3V
    unit_of_measurement: "Ω"
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic
    filters:
      - lambda: |-
          if (x < ${ntc_r_min} || x > ${ntc_r_max}) return NAN;
          return x;

  # Fast, internal: drives the heater cut-off every second.
  - platform: ntc
    sensor: ntc_widerstand
    id: sensor_temperatur
    internal: true
    calibration:
      - 3572Ohm -> -5°C
      - 1000Ohm -> 25°C
      - 290Ohm -> 60°C
    filters:
      - lambda: |-
          float o = id(ntc_offset).state;
          return isnan(o) ? x : x + o;

  # Smoothed copy for display (15 s mean, new value every 5 s).
  - platform: copy
    source_id: sensor_temperatur
    name: "Oberflächentemperatur"
    accuracy_decimals: 1
    filters:
      - sliding_window_moving_average:
          window_size: 15
          send_every: 5
          send_first_at: 5

  # Oscillator frequency. Capacitance and rate are computed here so that the
  # rate uses the true sample spacing.
  - platform: pulse_counter
    pin: ${gpio_c_freq}
    name: "Frequenz"
    entity_category: diagnostic
    unit_of_measurement: "Hz"
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 2s
    use_pcnt: true
    filters:
      - multiply: 0.0166667    # pulses/min -> Hz
      # I2C crosstalk corrupts about 1 of 4 windows; median over 5.
      - median:
          window_size: 5
    on_value:
      - lambda: |-
          // Stalled or sputtering oscillator: the surface leaks, treat as wet
          // but give no rate, so the latches cannot fire on it.
          float c_pf;
          float fref = id(freq_referenz).state;
          if (isnan(x) || x <= 0.0f) {
            c_pf = ${c_nass_max};
          } else if (isnan(fref) || fref <= 0.0f) {
            c_pf = NAN;   // not calibrated
          } else {
            c_pf = fref * 100.0f / x;
          }
          bool steht = c_pf >= ${c_nass_max};
          if (steht != id(g_steht))
            ESP_LOGW("kapazitaet", "%s", steht ? "Oscillator stalled" : "Oscillator running again");
          id(g_steht) = steht;
          if (steht) c_pf = ${c_nass_max};
          id(kapazitaet).publish_state(c_pf);

          float rate = NAN;
          auto jetzt = id(uhr).now();
          // While stalled keep the last good sample as the rate base.
          if (!steht && jetzt.is_valid()) {
            uint32_t t  = jetzt.timestamp;
            float    v  = id(c_vorher);
            uint32_t t0 = id(g_rate_stamp);
            id(c_vorher)     = c_pf;
            id(g_rate_stamp) = t;
            if (!isnan(v) && t0 != 0 && t > t0) {
              float dt_min = (t - t0) / 60.0f;
              // Gap too large (missed cycles, long sleep): no trend.
              if (dt_min <= 15.0f) rate = (c_pf - v) / dt_min;
            }
          }
          id(kapazitaet_rate).publish_state(rate);

  - platform: template
    name: "Kapazität"
    entity_category: diagnostic
    id: kapazitaet
    unit_of_measurement: "pF"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never

  # Wetting in percent for display, points from RC-SPC1K datasheet table 1.
  - platform: copy
    source_id: kapazitaet
    name: "Benetzung"
    icon: mdi:water-percent
    unit_of_measurement: "%"
    device_class: ""
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - calibrate_linear:
          method: exact
          datapoints:
            - 100 -> 0     # dry
            - 180 -> 25
            - 280 -> 40
            - 390 -> 50
            - 550 -> 100
      - clamp:
          min_value: 0
          max_value: 100

  # Rate in pF/min from real time; published by the frequency on_value.
  - platform: template
    name: "Kapazität Änderungsrate"
    entity_category: diagnostic
    id: kapazitaet_rate
    unit_of_measurement: "pF/min"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never
    filters:
      # One raw value per 10 s; 1 min mean.
      - sliding_window_moving_average:
          window_size: 6
          send_every: 1

  - platform: template
    name: "Heizkonto"
    unit_of_measurement: "min"
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 30s
    entity_category: diagnostic
    lambda: 'return id(g_heiz_sek) / 60.0f;'

  - platform: template
    name: "Sperre verbleibend"
    unit_of_measurement: "min"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 30s
    entity_category: diagnostic
    lambda: 'return id(g_sperre_sek) / 60.0f;'

  - platform: wifi_signal
    name: "WLAN Signal"
    entity_category: diagnostic
    update_interval: 120s

  - platform: uptime
    name: "Laufzeit"
    entity_category: diagnostic

  # Optional weather modules, prepared on the board but untested: uncomment
  # and check address/pins. Expansion header J8: IO32, IO33, IO26, IO27, IO14, IO4.
  #
  # # Pressure, temperature, humidity (I2C 0x76; BMP280: bmp280_i2c).
  # - platform: bme280_i2c
  #   address: 0x76
  #   update_interval: 8s
  #   temperature:
  #     name: "Außentemperatur"
  #   pressure:
  #     name: "Luftdruck"
  #   humidity:
  #     name: "Außenfeuchte"
  #
  # # UV (I2C 0x53).
  # - platform: ltr390
  #   address: 0x53
  #   update_interval: 8s
  #   uv_index:
  #     name: "UV-Index"
  #
  # # Cup anemometer, reed contact to GND (2.4 km/h per pulse/s is common).
  # - platform: pulse_counter
  #   pin:
  #     number: GPIO27
  #     mode: INPUT_PULLUP
  #   name: "Wind"
  #   unit_of_measurement: "km/h"
  #   update_interval: 10s
  #   filters:
  #     - multiply: 0.04   # pulses/min -> km/h
  #
  # # Wind vane (resistor network to GND, pull-up to 3V3): raw voltage, map it
  # # to directions for your vane. ADC1 pin, so it works with WiFi.
  # - platform: adc
  #   pin: GPIO33
  #   name: "Windrichtung Spannung"
  #   attenuation: 12db
  #   update_interval: 10s
  #
  # # Tipping bucket, reed contact to GND (0.2794 mm per tip is common).
  # # Tips during night-mode sleep are lost: do not combine with night mode.
  # - platform: pulse_counter
  #   pin:
  #     number: GPIO26
  #     mode: INPUT_PULLUP
  #   name: "Regenrate"
  #   unit_of_measurement: "mm/h"
  #   update_interval: 60s
  #   filters:
  #     - multiply: 16.764  # tips/min -> mm/h
  #   total:
  #     name: "Regenmenge"
  #     unit_of_measurement: "mm"
  #     filters:
  #       - multiply: 0.2794


binary_sensor:
  - platform: template
    name: "Feucht"
    device_class: moisture
    entity_category: diagnostic
    lambda: |-
      if (isnan(id(kapazitaet).state) || isnan(id(schwelle_feucht).state)) return {};
      return id(g_feucht);

  # Follows the rain latch, not the raw threshold: heavy dew reaches the same
  # capacitance as rain. Stays on during the heater test after a rain end,
  # so steady rain does not report a false end.
  - platform: template
    name: "Regen"
    device_class: moisture
    lambda: 'return id(g_regen) || id(g_regen_ende);'

  - platform: template
    name: "Heizsperre aktiv"
    device_class: problem
    lambda: 'return id(g_sperre_sek) > 0;'

  - platform: template
    name: "Oszillator steht"
    device_class: problem
    entity_category: diagnostic
    lambda: 'return id(g_steht);'


switch:
  # Boost enable + heater MOSFET. ALWAYS_OFF: a crash while heating must not
  # end in a permanently running heater.
  - platform: gpio
    pin: ${pin_heizung}
    id: heizung
    name: "Heizung"
    icon: mdi:radiator
    restore_mode: ALWAYS_OFF

  # Veto against night mode (keeps the device reachable, e.g. for OTA).
  # Off by default: enable only when the supply does not cut out at low load.
  - platform: template
    name: "Nachtmodus"
    id: nachtschlaf_frei
    icon: mdi:sleep
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config

  # Master switch for heating automation and night mode. Defaults to ON
  # (a forgotten OFF is the costlier error); not ALWAYS_ON, so a deliberate
  # OFF survives deep-sleep wakeups.
  - platform: template
    name: "Automatikbetrieb"
    id: automatikbetrieb
    icon: mdi:auto-mode
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    # Turning it on clears a running lockout.
    on_turn_on:
      - lambda: |-
          id(g_heiz_sek) = 0.0f;
          id(g_sperre_sek) = 0;


text_sensor:
  # Weather state. Capacitance says how wet, the rise says whether it falls:
  #   trocken   below the display threshold
  #   nass      wet surface without precipitation (dew, fog, drying after rain)
  #   Niesel    precipitation latch below rain
  #   Regen     rain latch, or drying after a rain end at rain level
  - platform: template
    name: "Wetterlage"
    id: wetterlage
    icon: mdi:weather-partly-rainy
    update_interval: 15s
    on_value:
      - lambda: |-
          static const char *const N[] = {${wl_namen}};
          for (int i = 0; i < (int)(sizeof(N) / sizeof(N[0])); i++)
            if (x == N[i]) id(g_lage) = i;
    lambda: |-
      float c  = id(kapazitaet).state;
      float sa = id(schwelle_anzeige).state;
      // No value yet (boot, wake from night mode) or stalled: keep the last state.
      if (isnan(c) || isnan(sa) || id(g_steht)) return {};
      // Latches are kept by the control loop, only read here.
      id(g_anz) = id(g_anz) ? c >= sa * ${hyst_faktor} : c >= sa;
      if (id(g_regen) || id(g_regen_ende)) return {"Regen"};
      if (!id(g_anz))   return {"trocken"};
      if (id(g_niesel)) return {"Niesel"};
      return {"nass"};

  - platform: version
    name: "ESPHome Version"
    entity_category: diagnostic
    disabled_by_default: true


# Control loop every second (the heater raises the surface ~0.7 K/s).
# Order: 0a precipitation latches, 0b elapsed time, 1 safety cut-off,
# 2 manual mode, 3 wet state, 4 heating limit, 5 heater test, 6 switch.
interval:
  - interval: 1s
    then:
      - lambda: |-
          float t  = id(sensor_temperatur).state;
          bool  heiz_an = id(heizung).state;
          float c  = id(kapazitaet).state;
          float sr = id(schwelle_regen).state;
          auto  jz = id(uhr).now();
          if (heiz_an && jz.is_valid()) id(g_heiz_ts) = jz.timestamp;

          // 0a) Precipitation latches. Level alone cannot separate rain from
          // dew or fog, but precipitation rises much faster.
          //   Niesel: rise >= "Niesel Erkennung" (not within niesel_sperre_s
          //           after heating).
          //   Regen:  rain level plus a rise >= "Regen Erkennung", or drizzle
          //           that reaches the rain level.
          // Both end when the rate stays below rate_ruhig for
          // "Regenende nach" (the heater then dries the surface) or when the
          // level falls back.
          // Runs first so it also runs in manual mode. Frozen while stalled.
          if (!isnan(c) && !isnan(sr) && !id(g_steht)) {
            float rr = id(kapazitaet_rate).state;
            float rn = id(rate_niesel).state;
            float rg = id(rate_regen).state;
            float sa = id(schwelle_anzeige).state;
            uint32_t h = id(g_heiz_ts);
            bool warm = heiz_an || (h != 0 && jz.is_valid() && jz.timestamp - h < ${niesel_sperre_s});

            bool vorher = id(g_niesel) || id(g_regen);
            if (!warm && !isnan(rr) && !isnan(rn) && rr >= rn) id(g_niesel) = true;
            if (c >= sr && !id(g_regen)) {
              bool schnell = !isnan(rr) && !isnan(rg) && rr >= rg;
              // Drizzle grown to the rain level is rain; after a rain end only a new fast rise counts.
              if (schnell || (id(g_niesel) && !id(g_regen_ende))) {
                id(g_regen) = true;
                id(g_regen_ende) = false;
              }
            }

            if (c < sr * 0.9f) {
              id(g_regen) = false;
              id(g_regen_ende) = false;
            }
            if (!isnan(sa) && c < sa) id(g_niesel) = false;
            // A new latch starts a new steady period.
            if (!vorher && (id(g_niesel) || id(g_regen))) id(g_ruhig_seit) = 0;

            // Steady level (needs the clock, works across night-mode sleep).
            if (!isnan(rr) && jz.is_valid()) {
              uint32_t seit = id(g_ruhig_seit);
              float ende = id(regenende_min).state;
              if (rr >= ${rate_ruhig}) {
                id(g_ruhig_seit) = 0;
              } else if (seit == 0 || jz.timestamp < seit) {
                id(g_ruhig_seit) = jz.timestamp;
              } else if (!isnan(ende) && jz.timestamp - seit >= (uint32_t)(ende * 60.0f)) {
                if (id(g_regen)) id(g_regen_ende) = true;
                id(g_regen)  = false;
                id(g_niesel) = false;
              }
            }
          }

          // Heating threshold with hysteresis, shared with the state text and
          // the "Feucht" sensor; runs before any early return.
          float sfh = id(schwelle_feucht).state;
          if (!isnan(c) && !isnan(sfh))
            id(g_feucht) = id(g_feucht) ? c >= sfh * ${hyst_heizung} : c >= sfh;

          // 0b) Elapsed time. Account and lockout run in real time: in night
          // mode this loop stalls (35 s awake per 5 min). Without a clock
          // it falls back to one second per run.
          float dt = 1.0f;
          if (jz.is_valid()) {
            uint32_t nun = jz.timestamp;
            uint32_t alt = id(g_konto_stamp);
            if (alt != 0 && nun >= alt) {
              // May be 0 (two runs in the same second); cap time jumps.
              dt = (float)(nun - alt);
              if (dt > 3600.0f) dt = 3600.0f;
            }
            id(g_konto_stamp) = nun;
          }

          // Heater account: up while heating, decays in pauses.
          float erh_min = id(erholung).state;
          if (isnan(erh_min) || erh_min < 1.0f) erh_min = 1.0f;
          if (heiz_an) id(g_heiz_sek) += dt;
          else         id(g_heiz_sek) -= dt / erh_min;
          if (id(g_heiz_sek) < 0.0f) id(g_heiz_sek) = 0.0f;

          if (id(g_sperre_sek) > 0 && dt >= 1.0f) {
            uint32_t ab = (uint32_t) dt;
            if (id(g_sperre_sek) > ab) {
              id(g_sperre_sek) -= ab;
            } else {
              id(g_sperre_sek) = 0;
              id(g_heiz_sek)   = 0.0f;
            }
          }

          // 1) Safety, always (also manual). NaN includes an implausible
          // resistance, i.e. a wiring fault.
          if (isnan(t) || t >= ${temp_aus}) {
            if (heiz_an) id(heizung).turn_off();
            return;
          }

          // 2) Manual mode: no further intervention (also skips the heating
          // limit; the temperature cut-off above still applies).
          if (!id(automatikbetrieb).state) return;

          // 3) Heat when wet, never during precipitation (the sensor has to
          // see it, and the heater cannot keep up with rain). Dew and fog are
          // dried too: they wet the plate slowly, and a dry plate stays
          // sensitive. After a rain end the surface is always dried.
          if (isnan(c) || isnan(sr) || isnan(sfh)) {
            if (heiz_an) id(heizung).turn_off();
            return;
          }
          // Stalled: heat anyway, drying may clear the leak (heating limit applies).
          bool soll = id(g_feucht) && (id(g_steht) || (!id(g_regen) && !id(g_niesel)));

          // 4) Heating limit: in fog the surface gets wet faster than it
          // dries. Exceeding the maximum triggers a fixed pause.
          float maxd = id(max_heizdauer).state;
          float abkl_min = id(abklingzeit).state;
          if (!isnan(maxd) && !isnan(abkl_min) &&
              id(g_sperre_sek) == 0 && id(g_heiz_sek) >= maxd * 60.0f) {
            id(g_sperre_sek) = (uint32_t)(abkl_min * 60.0f);
          }
          if (id(g_sperre_sek) > 0) {
            if (heiz_an) id(heizung).turn_off();
            id(g_trocknen_sek) = 0.0f;
            return;
          }

          // 5) Heater test after a rain end: still at the rain level after
          // regen_heiztest seconds of drying = it is still raining.
          if (soll && id(g_regen_ende) && !id(g_steht)) {
            id(g_trocknen_sek) += dt;
            if (c >= sr && id(g_trocknen_sek) >= ${regen_heiztest}) {
              id(g_regen) = true;
              id(g_regen_ende) = false;
              id(g_ruhig_seit) = 0;
              soll = false;
            }
          } else {
            id(g_trocknen_sek) = 0.0f;
          }

          // 6) Switch on change. Temperature hysteresis: after the cut-off,
          // switch on again only at or below temp_ein; switching off is
          // never delayed.
          if (soll && !heiz_an && t > ${temp_ein}) return;
          if (soll != heiz_an) {
            if (soll) id(heizung).turn_on();
            else      id(heizung).turn_off();
          }

  # Night mode. Sleep only if all conditions hold; otherwise stay awake
  # (a sleeping device is unreachable and does not measure).
  - interval: 5s
    then:
      - if:
          condition:
            and:
              - switch.is_on: automatikbetrieb
              - switch.is_on: nachtschlaf_frei
              - switch.is_off: heizung
              # Minimum wake time: first capacitance cycle and OTA window.
              - lambda: 'return millis() > ${schlaf_wachzeit};'
              - lambda: |-
                  float fvon = id(schlaf_von).state;
                  float fbis = id(schlaf_bis).state;
                  if (isnan(fvon) || isnan(fbis)) return false;
                  int von = (int) roundf(fvon * 2);
                  int bis = (int) roundf(fbis * 2);
                  if (von == bis) return false;            // empty window

                  auto jetzt = id(uhr).now();
                  if (jetzt.is_valid()) {
                    int h = jetzt.hour * 2 + (jetzt.minute >= 30 ? 1 : 0);
                    bool drin = (von < bis) ? (h >= von && h < bis)
                                            : ((h >= von) || (h < bis));
                    id(g_nacht) = drin;
                    return drin;
                  }

                  // No valid clock (time comes via SNTP, so it fails with
                  // WiFi): after 2 min use the last known state, otherwise
                  // the device would stay awake all night and drain the
                  // battery.
                  return id(g_nacht) && millis() > 120000;
          then:
            - logger.log: "Night window, going to sleep"
            - deep_sleep.enter: nachtschlaf
