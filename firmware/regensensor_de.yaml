# RC-SPC1KA capacitive rain sensor on rain-sensor-board (ESP32-WROOM-32E, ESPHome).
# Hardware: ../README.md. secrets.yaml needs wifi_ssid, wifi_password,
# regensensor_api_key, regensensor_ota_password.
# Calibrate: read the dry "Frequenz", enter it as "Trockenfrequenz", then tune thresholds.

substitutions:
  name: regensensor
  friendly_name: Regensensor

  pin_i2c_sda: GPIO21
  pin_i2c_scl: GPIO22
  pin_heizung: GPIO13    # boost enable + heater MOSFET
  gpio_c_freq: GPIO25    # oscillator input (hardware PCNT)
  pin_ntc: GPIO34        # GPIO32 if solder jumper SJ1 is moved
  pin_batt_adc: GPIO35   # J1 BAT via 100k/100k divider

  batt_teiler_faktor: "2.0"

  # NTC divider: 3V3 --[r_pullup]-- ADC --[NTC]-- GND. Permanently on 3V3
  # (0.87 mA with 2x 5.6k parallel); change only if R2/R3 differ.
  r_pullup: "2800"
  # ADC gain trim. Compare against a reference thermometer (same air, no sun,
  # heater off >= 30 min), then adjust; keep "NTC Offset" at 0.
  adc_faktor: "1.0"

  # Plausible NTC range; outside = fault, heater off (open wire / short).
  ntc_r_min: "80"        # ~108 C
  ntc_r_max: "13000"     # ~-29 C
  temp_aus: "45.0"       # heater off
  temp_ein: "40.0"       # heater may switch on again

  # Capacitance: C = Trockenfrequenz * 100 / f (dry frequency = 100 pF).
  # The runtime number "Trockenfrequenz" overrides this start value.
  # 13549 Hz is a placeholder from the vendor example, measure your own.
  c_freq_referenz_start: "13549.0"
  c_nass_max: "5000.0"   # pF, used when the oscillator stops (0 Hz)

  # Precipitation: rise thresholds are runtime numbers ("Niesel Erkennung",
  # "Regen Erkennung"; dew rises a few pF/min). Below rate_ruhig the level
  # counts as steady for "Regenende nach".
  rate_ruhig: "10"       # pF/min
  # After a rain end the heater dries the surface. Still at the rain level
  # after this many seconds of drying = still raining, rain is set again.
  regen_heiztest: "180"  # s

  # Hysteresis against flicker at thresholds: capacitance states fall back
  # below 95 % of their threshold, dew 0.5 °C above its threshold.
  hyst_faktor: "0.95"
  hyst_tau: "0.5"        # °C

  # Dew fallback without a dew point: slow wetting in the dark.
  lux_nacht: "5"         # lx
  # Morning drying ("Morgentrocknung ab") from this brightness on.
  lux_morgen: "100"      # lx
  morgen_abstand: "0.0"  # °C above the dew point (own limit, not "Tauschwelle")

  # Outdoor air from Home Assistant, used for the dew point. Missing entities
  # are fine: the sensors stay empty and the fallback above applies.
  aussen_temp_entity: sensor.outdoor_temperature
  aussen_feuchte_entity: sensor.outdoor_humidity
  aussen_gueltig_ms: "900000"   # validity of values pushed via set_aussenluft

  # Weather state texts; index stored across sleep (see on_boot).
  wl_namen: '"trocken", "feucht", "nass", "Tau", "Morgentau", "Abendtau", "Reif", "Niesel", "Regen", "Nebel"'

  # Night mode (deep sleep, RTC timer wake).
  schlaf_intervall: 5min
  schlaf_wachzeit: "35000"      # ms awake before sleeping


esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  # After a wake from night mode, report the last weather state at once
  # instead of "unknown" until the first measurement.
  on_boot:
    priority: -100
    then:
      - lambda: |-
          static const char *const N[] = {${wl_namen}};
          int i = id(g_wetterlage);
          if (i >= 0 && i < (int)(sizeof(N) / sizeof(N[0]))) id(wetterlage).publish_state(N[i]);

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:
  encryption:
    key: !secret regensensor_api_key
  actions:
    - action: set_aussenluft
      variables:
        temperatur: float
        feuchte: float
      then:
        - lambda: |-
            id(g_push_temp)  = temperatur;
            id(g_push_rh)    = feuchte;
            id(g_push_stamp) = millis();

ota:
  - platform: esphome
    password: !secret regensensor_ota_password
    on_begin:
      then:
        - deep_sleep.prevent: nachtschlaf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: light
  ap:
    ssid: "${friendly_name} Fallback"

captive_portal:

# Night window needs valid time; without it the device never sleeps.
time:
  - platform: homeassistant
    id: uhr

# Sleep is triggered only by the interval at the bottom.
deep_sleep:
  id: nachtschlaf
  sleep_duration: ${schlaf_intervall}

i2c:
  sda: ${pin_i2c_sda}
  scl: ${pin_i2c_scl}
  scan: true
  frequency: 100kHz

# restore_value goes to NVS flash; synced every 15 min and before deep sleep.
preferences:
  flash_write_interval: 15min

globals:
  # Previous capacitance for the rate; persisted across sleep.
  - id: c_vorher
    type: float
    restore_value: true
    initial_value: 'NAN'

  # Outdoor values pushed via set_aussenluft (take precedence).
  - id: g_push_temp
    type: float
    initial_value: 'NAN'
  - id: g_push_rh
    type: float
    initial_value: 'NAN'
  - id: g_push_stamp
    type: uint32_t
    initial_value: '0'

  # Surface minus dew point in K; NAN without outdoor data.
  - id: g_taupunkt_abstand
    type: float
    initial_value: 'NAN'

  # Heater account in seconds: rises while heating, decays in pauses.
  # Persisted, otherwise the limit cannot act across night-mode wakeups.
  - id: g_heiz_sek
    type: float
    restore_value: true
    initial_value: '0.0'

  # Remaining lockout in seconds.
  - id: g_sperre_sek
    type: uint32_t
    restore_value: true
    initial_value: '0'

  # Unix time of the last capacitance sample (millis() restarts after sleep).
  - id: g_rate_stamp
    type: uint32_t
    restore_value: true
    initial_value: '0'

  # Precipitation latches (set by a fast rise, see the control loop), so heavy
  # dew is not reported as rain and the heater stays off while it rains.
  - id: g_regen
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: g_niesel
    type: bool
    restore_value: true
    initial_value: 'false'
  # Rain released by "Regenende nach" while still above the rain level: only
  # a new fast rise or the heater test sets it again.
  - id: g_regen_ende
    type: bool
    restore_value: true
    initial_value: 'false'
  # Unix time since the level is steady (0 = rising).
  - id: g_ruhig_seit
    type: uint32_t
    restore_value: true
    initial_value: '0'
  # Seconds of drying after a rain end (heater test).
  - id: g_trocknen_sek
    type: float
    initial_value: '0.0'

  # Unix time of the last control-loop run (account and lockout use real time).
  - id: g_konto_stamp
    type: uint32_t
    restore_value: true
    initial_value: '0'

  # Held states behind the hysteresis (see hyst_* above).
  - id: g_tau
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: g_anz          # capacitance at or above the display threshold
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: g_feucht       # capacitance at or above the heating threshold
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: g_morgen       # morning drying running
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: g_morgen_tag   # day of the last morning drying (year * 1000 + day)
    type: uint32_t
    restore_value: true
    initial_value: '0'

  # Last published weather state (index into wl_namen, -1 = none).
  - id: g_wetterlage
    type: int
    restore_value: true
    initial_value: '-1'

  # Last known "inside night window", fallback when the clock is missing.
  - id: g_nacht
    type: bool
    restore_value: true
    initial_value: 'false'


# Runtime thresholds; initial_value applies only on the first boot.
# Start values from measurements: dry 100, dew ~105-120 (cloudy night) to
# ~170-200 (clear night), spray mist ~270, three drops ~290, heavy spray ~600,
# soaked cloth 870-1240 pF. The sensor reacts to humid air before water lies
# on it: keep the display threshold above a humid night without dew.
number:
  # Dry frequency of your setup = 100 pF. Read "Frequenz" with a completely
  # dry surface and enter the mean here. "Kapazität" stays NAN without it.
  - platform: template
    name: "Trockenfrequenz"
    id: freq_referenz
    unit_of_measurement: "Hz"
    min_value: 1000
    max_value: 30000
    step: 1
    initial_value: ${c_freq_referenz_start}
    restore_value: true
    optimistic: true
    mode: box
    entity_category: config

  # From here the weather state shows humidity/dew, no heating.
  - platform: template
    name: "Anzeigeschwelle"
    id: schwelle_anzeige
    unit_of_measurement: "pF"
    min_value: 100
    max_value: 1500
    step: 10
    initial_value: 110
    restore_value: true
    optimistic: true
    mode: box
    entity_category: config

  # Dew from this surface-minus-dew-point distance down (sensor and outdoor
  # sensor differ in place and exposure, so tune it on a dewy morning).
  - platform: template
    name: "Tauschwelle"
    id: schwelle_tau
    unit_of_measurement: "°C"
    device_class: temperature_delta
    min_value: 0
    max_value: 5
    step: 0.1
    initial_value: 2.0
    restore_value: true
    optimistic: true
    mode: box
    entity_category: config

  # VEML7700 sits behind a cover; this compensates for its attenuation.
  # No precise measurement exists, so tune against a known outdoor lux value.
  - platform: template
    name: "Glasfaktor"
    id: glasfaktor
    unit_of_measurement: "x"
    min_value: 1
    max_value: 5
    step: 0.1
    initial_value: 1.6
    restore_value: true
    optimistic: true
    mode: box
    entity_category: config

  # From here the automation heats ("Feucht" turns on), unless it rains.
  - platform: template
    name: "Feuchtigkeitsschwelle"
    id: schwelle_feucht
    unit_of_measurement: "pF"
    min_value: 100
    max_value: 1500
    step: 10
    initial_value: 200
    restore_value: true
    optimistic: true
    mode: box
    entity_category: config

  # Morning drying, once a day: 04-11 h, light, surface above the dew point
  # (morgen_abstand), level at least this: one heat pulse up to
  # "Morgentrocknung Temperatur". At or above "Feuchtigkeitsschwelle": off.
  - platform: template
    name: "Morgentrocknung ab"
    id: schwelle_morgen
    unit_of_measurement: "pF"
    min_value: 100
    max_value: 1500
    step: 10
    initial_value: 150
    restore_value: true
    optimistic: true
    mode: box
    entity_category: config

  # Target of the morning pulse; normal heating stays at temp_aus.
  - platform: template
    name: "Morgentrocknung Temperatur"
    id: morgen_temp
    unit_of_measurement: "°C"
    min_value: 45
    max_value: 60
    step: 1
    initial_value: 55
    restore_value: true
    optimistic: true
    mode: box
    entity_category: config

  # Rain level: rain needs this level plus a fast rise ("Regen Erkennung")
  # or a surface clearly above the dew point.
  - platform: template
    name: "Regenschwelle"
    id: schwelle_regen
    unit_of_measurement: "pF"
    min_value: 200
    max_value: 5000
    step: 50
    initial_value: 500
    restore_value: true
    optimistic: true
    mode: box
    entity_category: config

  # Rise that counts as precipitation; also blocks the heater.
  - platform: template
    name: "Niesel Erkennung"
    id: rate_niesel
    unit_of_measurement: "pF/min"
    min_value: 10
    max_value: 500
    step: 5
    initial_value: 60
    restore_value: true
    optimistic: true
    mode: box
    entity_category: config

  - platform: template
    name: "Regen Erkennung"
    id: rate_regen
    unit_of_measurement: "pF/min"
    min_value: 20
    max_value: 1000
    step: 10
    initial_value: 150
    restore_value: true
    optimistic: true
    mode: box
    entity_category: config

  # Drizzle and rain end after this long without a rise.
  - platform: template
    name: "Regenende nach"
    id: regenende_min
    unit_of_measurement: "min"
    min_value: 1
    max_value: 60
    step: 1
    initial_value: 7
    restore_value: true
    optimistic: true
    mode: box
    entity_category: config

  # Heating limit against continuous fog/drizzle.
  - platform: template
    name: "Max. Heizdauer"
    id: max_heizdauer
    unit_of_measurement: "min"
    min_value: 5
    max_value: 30
    step: 1
    initial_value: 15
    restore_value: true
    optimistic: true
    mode: box
    entity_category: config

  # Night window in half hours (22.5 = 22:30), may span midnight. Equal values = never sleep.
  - platform: template
    name: "Nachtmodus von"
    id: schlaf_von
    unit_of_measurement: "Uhr"
    min_value: 0
    max_value: 23.5
    step: 0.5
    initial_value: 22
    restore_value: true
    optimistic: true
    mode: box
    entity_category: config

  - platform: template
    name: "Nachtmodus bis"
    id: schlaf_bis
    unit_of_measurement: "Uhr"
    min_value: 0
    max_value: 23.5
    step: 0.5
    initial_value: 5
    restore_value: true
    optimistic: true
    mode: box
    entity_category: config

  # Pause minutes per heating minute: duty limit 1/(1+x), 6 -> 14 %.
  - platform: template
    name: "Pause je Heizminute"
    id: erholung
    unit_of_measurement: "min"
    min_value: 1
    max_value: 20
    step: 1
    initial_value: 6
    restore_value: true
    optimistic: true
    mode: box
    entity_category: config

  - platform: template
    name: "Heizpause"
    id: abklingzeit
    unit_of_measurement: "min"
    min_value: 30
    max_value: 1440
    step: 30
    initial_value: 120
    restore_value: true
    optimistic: true
    mode: box
    entity_category: config

  # Fine trim of the surface temperature (coarse: adc_faktor). Calibrate only
  # against air temperature in the daytime: at night the plate is correctly
  # colder than the air, that is the dew signal.
  - platform: template
    name: "NTC Offset"
    id: ntc_offset
    unit_of_measurement: "K"
    min_value: -5
    max_value: 5
    step: 0.1
    initial_value: 0
    restore_value: true
    optimistic: true
    mode: box
    entity_category: config


sensor:
  # I2C sensors at 8 s so they report within the 35 s night-mode wake time.
  - platform: veml7700
    address: 0x10
    update_interval: 8s
    ambient_light:
      name: "Helligkeit"
      id: helligkeit
      accuracy_decimals: 1
      filters:
        - lambda: |-
            return isnan(x) ? x : x * id(glasfaktor).state;

  # Rough lux -> W/m2 for daylight; classification uses only day/night.
  - platform: template
    name: "Sonneneinstrahlung"
    unit_of_measurement: "W/m²"
    device_class: irradiance
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 15s
    lambda: |-
      if (isnan(id(helligkeit).state)) return NAN;
      return id(helligkeit).state * 0.01;

  # HTU21D inside the enclosure: battery climate (no charging below 0 °C)
  # and desiccant check.
  - platform: htu21d
    address: 0x40
    update_interval: 8s
    temperature:
      name: "Box Temperatur"
      id: box_temperatur
      entity_category: diagnostic
      accuracy_decimals: 1
    humidity:
      name: "Box Luftfeuchte"
      entity_category: diagnostic
      accuracy_decimals: 1

  # NTC chain: ADC -> resistance -> temperature.
  - platform: adc
    pin: ${pin_ntc}
    id: ntc_adc
    attenuation: 12db
    update_interval: 1s
    internal: true
    samples: 16
    filters:
      - multiply: ${adc_faktor}
      - median:
          window_size: 3
          send_every: 1
      # ~3 s time constant: display lags ~1 K while heating.
      - exponential_moving_average:
          alpha: 0.3
          send_every: 1

  # Battery voltage (Waveshare Solar Power Manager D) on J1 BAT.
  - platform: adc
    pin: ${pin_batt_adc}
    attenuation: 12db
    update_interval: 30s
    samples: 16
    filters:
      - multiply: ${batt_teiler_faktor}
      - exponential_moving_average:
          alpha: 0.2
          send_every: 1
    name: "Batteriespannung"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 2
    entity_category: diagnostic

  - platform: resistance
    sensor: ntc_adc
    id: ntc_widerstand
    name: "NTC Widerstand"
    configuration: DOWNSTREAM
    resistor: ${r_pullup}Ohm
    reference_voltage: 3.3V
    unit_of_measurement: "Ω"
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic
    filters:
      - lambda: |-
          if (x < ${ntc_r_min} || x > ${ntc_r_max}) return NAN;
          return x;

  # Fast, internal: drives the heater cut-off every second.
  - platform: ntc
    sensor: ntc_widerstand
    id: sensor_temperatur
    internal: true
    calibration:
      - 3572Ohm -> -5°C
      - 1000Ohm -> 25°C
      - 290Ohm -> 60°C
    filters:
      - lambda: |-
          float o = id(ntc_offset).state;
          return isnan(o) ? x : x + o;

  # Smoothed copy for HA and dew logic (15 s mean, new value every 5 s).
  - platform: copy
    source_id: sensor_temperatur
    id: temp_ruhig
    name: "Oberflächentemperatur"
    accuracy_decimals: 1
    filters:
      - sliding_window_moving_average:
          window_size: 15
          send_every: 5
          send_first_at: 5

  # Oscillator frequency. Capacitance and rate are computed here so that the
  # rate uses the true sample spacing.
  - platform: pulse_counter
    pin: ${gpio_c_freq}
    name: "Frequenz"
    entity_category: diagnostic
    unit_of_measurement: "Hz"
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 2s
    use_pcnt: true
    filters:
      - multiply: 0.0166667    # pulses/min -> Hz
      # I2C crosstalk corrupts about 1 of 4 windows; median over 5.
      - median:
          window_size: 5
    on_value:
      - lambda: |-
          // 0 Hz: oscillator stopped, surface conducts, treat as wet.
          float c_pf;
          float fref = id(freq_referenz).state;
          if (isnan(x) || x <= 0.0f) {
            c_pf = ${c_nass_max};
          } else if (isnan(fref) || fref <= 0.0f) {
            c_pf = NAN;   // not calibrated
          } else {
            c_pf = fref * 100.0f / x;
          }
          id(kapazitaet).publish_state(c_pf);

          float rate = NAN;
          auto jetzt = id(uhr).now();
          if (jetzt.is_valid()) {
            uint32_t t  = jetzt.timestamp;
            float    v  = id(c_vorher);
            uint32_t t0 = id(g_rate_stamp);
            id(c_vorher)     = c_pf;
            id(g_rate_stamp) = t;
            if (!isnan(v) && t0 != 0 && t > t0) {
              float dt_min = (t - t0) / 60.0f;
              // Gap too large (missed cycles, long sleep): no trend.
              if (dt_min <= 15.0f) rate = (c_pf - v) / dt_min;
            }
          }
          id(kapazitaet_rate).publish_state(rate);

  - platform: template
    name: "Kapazität"
    entity_category: diagnostic
    id: kapazitaet
    unit_of_measurement: "pF"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never

  # Wetting in percent for display, points from RC-SPC1K datasheet table 1.
  - platform: copy
    source_id: kapazitaet
    name: "Benetzung"
    icon: mdi:water-percent
    unit_of_measurement: "%"
    device_class: ""
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - lambda: |-
          //                pF     %
          static const float P[][2] = {
            { 100.0f,   0.0f },   // dry
            { 180.0f,  25.0f },
            { 280.0f,  40.0f },
            { 390.0f,  50.0f },
            { 550.0f, 100.0f },
          };
          const int N = sizeof(P) / sizeof(P[0]);
          if (isnan(x)) return NAN;
          if (x <= P[0][0]) return 0.0f;
          for (int i = 1; i < N; i++) {
            if (x <= P[i][0]) {
              float f = (x - P[i-1][0]) / (P[i][0] - P[i-1][0]);
              return P[i-1][1] + f * (P[i][1] - P[i-1][1]);
            }
          }
          return 100.0f;

  # Rate in pF/min from real time; published by the frequency on_value.
  - platform: template
    name: "Kapazität Änderungsrate"
    entity_category: diagnostic
    id: kapazitaet_rate
    unit_of_measurement: "pF/min"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never
    filters:
      # One raw value per 10 s; 1 min mean.
      - sliding_window_moving_average:
          window_size: 6
          send_every: 1

  - platform: template
    name: "Heizkonto"
    unit_of_measurement: "min"
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 30s
    entity_category: diagnostic
    lambda: 'return id(g_heiz_sek) / 60.0f;'

  - platform: template
    name: "Sperre verbleibend"
    unit_of_measurement: "min"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 30s
    entity_category: diagnostic
    lambda: 'return id(g_sperre_sek) / 60.0f;'

  # Outdoor air from Home Assistant (optional, see substitutions).
  - platform: homeassistant
    id: aussen_temperatur
    entity_id: ${aussen_temp_entity}
    internal: true

  - platform: homeassistant
    id: aussen_feuchte
    entity_id: ${aussen_feuchte_entity}
    internal: true

  - platform: template
    name: "Taupunkt"
    id: taupunkt
    entity_category: diagnostic
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 15s
    lambda: |-
      float t = NAN, rh = NAN;

      // 1) Values pushed via the API action while fresh (0 = none yet).
      uint32_t st = id(g_push_stamp);
      if (st != 0 && (millis() - st) < ${aussen_gueltig_ms}) {
        t  = id(g_push_temp);
        rh = id(g_push_rh);
      }

      // 2) Otherwise the subscribed entities.
      if (isnan(t) || isnan(rh)) {
        t  = id(aussen_temperatur).state;
        rh = id(aussen_feuchte).state;
      }

      if (isnan(t) || isnan(rh) || rh <= 0.0f) return NAN;
      float a = logf(rh / 100.0f) + (17.62f * t) / (243.12f + t);
      return 243.12f * a / (17.62f - a);

  # Surface minus dew point: at or below zero, water condenses. Below 0 C on
  # the surface the frost point (Magnus over ice) is used, up to ~1 K higher.
  - platform: template
    name: "Abstand zum Taupunkt"
    entity_category: diagnostic
    unit_of_measurement: "°C"
    device_class: temperature_delta
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 15s
    lambda: |-
      float ts = id(temp_ruhig).state;
      float td = id(taupunkt).state;
      if (!isnan(ts) && !isnan(td) && ts <= 0.0f && td < 0.0f) {
        float g = 17.62f * td / (243.12f + td);
        td = 272.62f * g / (22.46f - g);
      }
      float d = (isnan(ts) || isnan(td)) ? NAN : (ts - td);
      id(g_taupunkt_abstand) = d;
      return d;

  - platform: wifi_signal
    name: "WLAN Signal"
    entity_category: diagnostic
    update_interval: 120s

  - platform: uptime
    name: "Laufzeit"
    entity_category: diagnostic

  # Optional weather modules, prepared on the board but untested: uncomment
  # and check address/pins. Expansion header J8: IO32, IO33, IO26, IO27, IO14, IO4.
  #
  # # Pressure, temperature, humidity (I2C 0x76; BMP280: bmp280_i2c).
  # - platform: bme280_i2c
