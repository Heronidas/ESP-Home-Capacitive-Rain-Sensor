# RC-SPC1KA capacitive rain sensor on rain-sensor-board (ESP32-WROOM-32E, ESPHome).
# Hardware: ../README.md. secrets.yaml needs wifi_ssid, wifi_password,
# rain_sensor_api_key, rain_sensor_ota_password.
# Calibrate: read the dry "Frequency", enter it as "Dry Frequency", then tune thresholds.

substitutions:
  name: rain-sensor
  friendly_name: Rain Sensor

  pin_i2c_sda: GPIO21
  pin_i2c_scl: GPIO22
  pin_heater: GPIO13    # boost enable + heater MOSFET
  gpio_c_freq: GPIO25    # oscillator input (hardware PCNT)
  pin_ntc: GPIO34        # GPIO32 if solder jumper SJ1 is moved
  pin_batt_adc: GPIO35   # J1 BAT via 100k/100k divider

  batt_divider_factor: "2.0"

  # NTC divider: 3V3 --[r_pullup]-- ADC --[NTC]-- GND. Permanently on 3V3
  # (0.87 mA with 2x 5.6k parallel); change only if R2/R3 differ.
  r_pullup: "2800"
  # ADC gain trim. Compare against a reference thermometer (same air, no sun,
  # heater off >= 30 min), then adjust; keep "NTC Offset" at 0.
  adc_factor: "1.0"

  # Plausible NTC range; outside = fault, heater off (open wire / short).
  ntc_r_min: "80"        # ~108 C
  ntc_r_max: "13000"     # ~-29 C
  temp_off: "45.0"       # heater off
  temp_on: "40.0"       # heater may switch on again

  # Capacitance: C = Dry Frequency * 100 / f (dry frequency = 100 pF).
  # The runtime number "Dry Frequency" overrides this start value.
  # 13549 Hz is a placeholder from the vendor example, measure your own.
  c_freq_reference_start: "13549.0"
  c_wet_max: "5000.0"   # pF, used when the oscillator stops (0 Hz)

  # Precipitation: rise thresholds are runtime numbers ("Drizzle Detection",
  # "Rain Detection"; dew rises a few pF/min). Below rate_steady the level
  # counts as steady for "Rain End After".
  rate_steady: "10"       # pF/min
  # After a rain end the heater dries the surface. Still at the rain level
  # after this many seconds of drying = still raining, rain is set again.
  rain_heater_test: "180"  # s

  # Hysteresis against flicker at thresholds: capacitance states fall back
  # below 95 % of their threshold, dew 0.5 °C above its threshold.
  hyst_factor: "0.95"
  hyst_dew: "0.5"        # °C

  # Dew fallback without a dew point: slow wetting in the dark.
  lux_night: "5"         # lx

  # Outdoor air from Home Assistant, used for the dew point. Missing entities
  # are fine: the sensors stay empty and the fallback above applies.
  outdoor_temp_entity: sensor.outdoor_temperature
  outdoor_humidity_entity: sensor.outdoor_humidity
  outdoor_valid_ms: "900000"   # validity of values pushed via set_outdoor_air

  # Night mode (deep sleep, RTC timer wake).
  sleep_interval: 5min
  sleep_wake_time: "35000"      # ms awake before sleeping


esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:
  encryption:
    key: !secret rain_sensor_api_key
  actions:
    - action: set_outdoor_air
      variables:
        temperature: float
        humidity: float
      then:
        - lambda: |-
            id(g_push_temp)  = temperature;
            id(g_push_rh)    = humidity;
            id(g_push_stamp) = millis();

ota:
  - platform: esphome
    password: !secret rain_sensor_ota_password
    on_begin:
      then:
        - deep_sleep.prevent: night_sleep

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: light
  ap:
    ssid: "${friendly_name} Fallback"

captive_portal:

# Night window needs valid time; without it the device never sleeps.
time:
  - platform: homeassistant
    id: ha_time

# Sleep is triggered only by the interval at the bottom.
deep_sleep:
  id: night_sleep
  sleep_duration: ${sleep_interval}

i2c:
  sda: ${pin_i2c_sda}
  scl: ${pin_i2c_scl}
  scan: true
  frequency: 100kHz

# restore_value goes to NVS flash; synced every 15 min and before deep sleep.
preferences:
  flash_write_interval: 15min

globals:
  # Previous capacitance for the rate; persisted across sleep.
  - id: c_previous
    type: float
    restore_value: true
    initial_value: 'NAN'

  # Outdoor values pushed via set_outdoor_air (take precedence).
  - id: g_push_temp
    type: float
    initial_value: 'NAN'
  - id: g_push_rh
    type: float
    initial_value: 'NAN'
  - id: g_push_stamp
    type: uint32_t
    initial_value: '0'

  # Surface minus dew point in K; NAN without outdoor data.
  - id: g_dew_point_distance
    type: float
    initial_value: 'NAN'

  # Heater account in seconds: rises while heating, decays in pauses.
  # Persisted, otherwise the limit cannot act across night-mode wakeups.
  - id: g_heat_sec
    type: float
    restore_value: true
    initial_value: '0.0'

  # Remaining lockout in seconds.
  - id: g_lockout_sec
    type: uint32_t
    restore_value: true
    initial_value: '0'

  # Unix time of the last capacitance sample (millis() restarts after sleep).
  - id: g_rate_stamp
    type: uint32_t
    restore_value: true
    initial_value: '0'

  # Precipitation latches (set by a fast rise, see the control loop), so heavy
  # dew is not reported as rain and the heater stays off while it rains.
  - id: g_rain
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: g_drizzle
    type: bool
    restore_value: true
    initial_value: 'false'
  # Rain released by "Rain End After" while still above the rain level: only
  # a new fast rise or the heater test sets it again.
  - id: g_rain_ended
    type: bool
    restore_value: true
    initial_value: 'false'
  # Unix time since the level is steady (0 = rising).
  - id: g_steady_since
    type: uint32_t
    restore_value: true
    initial_value: '0'
  # Seconds of drying after a rain end (heater test).
  - id: g_drying_sec
    type: float
    initial_value: '0.0'

  # Unix time of the last control-loop run (account and lockout use real time).
  - id: g_account_stamp
    type: uint32_t
    restore_value: true
    initial_value: '0'

  # Held states behind the hysteresis (see hyst_* above).
  - id: g_dew
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: g_display          # capacitance at or above the display threshold
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: g_humid       # capacitance at or above the heating threshold
    type: bool
    restore_value: true
    initial_value: 'false'

  # Last known "inside night window", fallback when the clock is missing.
  - id: g_night
    type: bool
    restore_value: true
    initial_value: 'false'


# Runtime thresholds; initial_value applies only on the first boot.
# Start values from measurements: dry 100, dewy night up to ~120,
# mist ~270, three drops ~290, heavy spray ~600, soaked cloth 870-1240 pF.
# The sensor reacts to humid air before water lies on it: keep the display
# threshold above the maximum of a dry, humid night.
number:
  # Dry frequency of your setup = 100 pF. Read "Frequency" with a completely
  # dry surface and enter the mean here. "Capacitance" stays NAN without it.
  - platform: template
    name: "Dry Frequency"
    id: freq_reference
    unit_of_measurement: "Hz"
    min_value: 1000
    max_value: 30000
    step: 1
    initial_value: ${c_freq_reference_start}
    restore_value: true
    optimistic: true
    mode: box
    entity_category: config

  # From here the weather state shows humidity/dew, no heating.
  - platform: template
    name: "Display Threshold"
    id: threshold_display
    unit_of_measurement: "pF"
    min_value: 100
    max_value: 1500
    step: 10
    initial_value: 110
    restore_value: true
    optimistic: true
    mode: box
    entity_category: config

  # Dew from this surface-minus-dew-point distance down (sensor and outdoor
  # sensor differ in place and exposure, so tune it on a dewy morning).
  - platform: template
    name: "Dew Threshold"
    id: threshold_dew
    unit_of_measurement: "°C"
    device_class: temperature_delta
    min_value: 0
    max_value: 5
    step: 0.1
    initial_value: 2.0
    restore_value: true
    optimistic: true
    mode: box
    entity_category: config

  # VEML7700 sits behind a cover; this compensates for its attenuation.
  # No precise measurement exists, so tune against a known outdoor lux value.
  - platform: template
    name: "Glass Factor"
    id: glass_factor
    unit_of_measurement: "x"
    min_value: 1
    max_value: 5
    step: 0.1
    initial_value: 1.6
    restore_value: true
    optimistic: true
    mode: box
    entity_category: config

  # From here the automation heats ("Humid" turns on), unless it rains.
  - platform: template
    name: "Humidity Threshold"
    id: threshold_humid
    unit_of_measurement: "pF"
    min_value: 100
    max_value: 1500
    step: 10
    initial_value: 200
    restore_value: true
    optimistic: true
    mode: box
    entity_category: config

  # Rain level: rain needs this level plus a fast rise ("Rain Detection")
  # or a surface clearly above the dew point.
  - platform: template
    name: "Rain Threshold"
    id: threshold_rain
    unit_of_measurement: "pF"
    min_value: 200
    max_value: 5000
    step: 50
    initial_value: 500
    restore_value: true
    optimistic: true
    mode: box
    entity_category: config

  # Rise that counts as precipitation; also blocks the heater.
  - platform: template
    name: "Drizzle Detection"
    id: rate_drizzle
    unit_of_measurement: "pF/min"
    min_value: 10
    max_value: 500
    step: 5
    initial_value: 60
    restore_value: true
    optimistic: true
    mode: box
    entity_category: config

  - platform: template
    name: "Rain Detection"
    id: rate_rain
    unit_of_measurement: "pF/min"
    min_value: 20
    max_value: 1000
    step: 10
    initial_value: 150
    restore_value: true
    optimistic: true
    mode: box
    entity_category: config

  # Drizzle and rain end after this long without a rise.
  - platform: template
    name: "Rain End After"
    id: rain_end_min
    unit_of_measurement: "min"
    min_value: 1
    max_value: 60
    step: 1
    initial_value: 7
    restore_value: true
    optimistic: true
    mode: box
    entity_category: config

  # Heating limit against continuous fog/drizzle.
  - platform: template
    name: "Max. Heating Time"
    id: max_heat_duration
    unit_of_measurement: "min"
    min_value: 5
    max_value: 30
    step: 1
    initial_value: 15
    restore_value: true
    optimistic: true
    mode: box
    entity_category: config

  # Night window in half hours (22.5 = 22:30), may span midnight. Equal values = never sleep.
  - platform: template
    name: "Night Mode From"
    id: sleep_from
    unit_of_measurement: "h"
    min_value: 0
    max_value: 23.5
    step: 0.5
    initial_value: 22
    restore_value: true
    optimistic: true
    mode: box
    entity_category: config

  - platform: template
    name: "Night Mode Until"
    id: sleep_until
    unit_of_measurement: "h"
    min_value: 0
    max_value: 23.5
    step: 0.5
    initial_value: 5
    restore_value: true
    optimistic: true
    mode: box
    entity_category: config

  # Pause minutes per heating minute: duty limit 1/(1+x), 6 -> 14 %.
  - platform: template
    name: "Pause per Heating Minute"
    id: recovery
    unit_of_measurement: "min"
    min_value: 1
    max_value: 20
    step: 1
    initial_value: 6
    restore_value: true
    optimistic: true
    mode: box
    entity_category: config

  - platform: template
    name: "Heating Pause"
    id: cooldown
    unit_of_measurement: "min"
    min_value: 30
    max_value: 1440
    step: 30
    initial_value: 120
    restore_value: true
    optimistic: true
    mode: box
    entity_category: config

  # Fine trim of the surface temperature (coarse: adc_factor). Calibrate only
  # against air temperature in the daytime: at night the plate is correctly
  # colder than the air, that is the dew signal.
  - platform: template
    name: "NTC Offset"
    id: ntc_offset
    unit_of_measurement: "K"
    min_value: -5
    max_value: 5
    step: 0.1
    initial_value: 0
    restore_value: true
    optimistic: true
    mode: box
    entity_category: config


sensor:
  # I2C sensors at 8 s so they report within the 35 s night-mode wake time.
  - platform: veml7700
    address: 0x10
    update_interval: 8s
    ambient_light:
      name: "Brightness"
      id: brightness
      accuracy_decimals: 1
      filters:
        - lambda: |-
            return isnan(x) ? x : x * id(glass_factor).state;

  # Rough lux -> W/m2 for daylight; classification uses only day/night.
  - platform: template
    name: "Solar Irradiance"
    unit_of_measurement: "W/m²"
    device_class: irradiance
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 15s
    lambda: |-
      if (isnan(id(brightness).state)) return NAN;
      return id(brightness).state * 0.01;

  # HTU21D inside the enclosure: battery climate (no charging below 0 °C)
  # and desiccant check.
  - platform: htu21d
    address: 0x40
    update_interval: 8s
    temperature:
      name: "Box Temperature"
      id: box_temperature
      entity_category: diagnostic
      accuracy_decimals: 1
    humidity:
      name: "Box Humidity"
      entity_category: diagnostic
      accuracy_decimals: 1

  # NTC chain: ADC -> resistance -> temperature.
  - platform: adc
    pin: ${pin_ntc}
    id: ntc_adc
    attenuation: 12db
    update_interval: 1s
    internal: true
    samples: 16
    filters:
      - multiply: ${adc_factor}
      - median:
          window_size: 3
          send_every: 1
      # ~3 s time constant: display lags ~1 K while heating.
      - exponential_moving_average:
          alpha: 0.3
          send_every: 1

  # Battery voltage (Waveshare Solar Power Manager D) on J1 BAT.
  - platform: adc
    pin: ${pin_batt_adc}
    attenuation: 12db
    update_interval: 30s
    samples: 16
    filters:
      - multiply: ${batt_divider_factor}
      - exponential_moving_average:
          alpha: 0.2
          send_every: 1
    name: "Battery Voltage"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 2
    entity_category: diagnostic

  - platform: resistance
    sensor: ntc_adc
    id: ntc_resistance
    name: "NTC Resistance"
    configuration: DOWNSTREAM
    resistor: ${r_pullup}Ohm
    reference_voltage: 3.3V
    unit_of_measurement: "Ω"
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic
    filters:
      - lambda: |-
          if (x < ${ntc_r_min} || x > ${ntc_r_max}) return NAN;
          return x;

  # Fast, internal: drives the heater cut-off every second.
  - platform: ntc
    sensor: ntc_resistance
    id: sensor_temperature
    internal: true
    calibration:
      - 3572Ohm -> -5°C
      - 1000Ohm -> 25°C
      - 290Ohm -> 60°C
    filters:
      - lambda: |-
          float o = id(ntc_offset).state;
          return isnan(o) ? x : x + o;

  # Smoothed copy for HA and dew logic (15 s mean, new value every 5 s).
  - platform: copy
    source_id: sensor_temperature
    id: temp_smoothed
    name: "Surface Temperature"
    accuracy_decimals: 1
    filters:
      - sliding_window_moving_average:
          window_size: 15
          send_every: 5
          send_first_at: 5

  # Oscillator frequency. Capacitance and rate are computed here so that the
  # rate uses the true sample spacing.
  - platform: pulse_counter
    pin: ${gpio_c_freq}
    name: "Frequency"
    entity_category: diagnostic
    unit_of_measurement: "Hz"
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 2s
    use_pcnt: true
    filters:
      - multiply: 0.0166667    # pulses/min -> Hz
      # I2C crosstalk corrupts about 1 of 4 windows; median over 5.
      - median:
          window_size: 5
    on_value:
      - lambda: |-
          // 0 Hz: oscillator stopped, surface conducts, treat as wet.
          float c_pf;
          float fref = id(freq_reference).state;
          if (isnan(x) || x <= 0.0f) {
            c_pf = ${c_wet_max};
          } else if (isnan(fref) || fref <= 0.0f) {
            c_pf = NAN;   // not calibrated
          } else {
            c_pf = fref * 100.0f / x;
          }
          id(capacitance).publish_state(c_pf);

          float rate = NAN;
          auto now_time = id(ha_time).now();
          if (now_time.is_valid()) {
            uint32_t t  = now_time.timestamp;
            float    v  = id(c_previous);
            uint32_t t0 = id(g_rate_stamp);
            id(c_previous)     = c_pf;
            id(g_rate_stamp) = t;
            if (!isnan(v) && t0 != 0 && t > t0) {
              float dt_min = (t - t0) / 60.0f;
              // Gap too large (missed cycles, long sleep): no trend.
              if (dt_min <= 15.0f) rate = (c_pf - v) / dt_min;
            }
          }
          id(capacitance_rate).publish_state(rate);

  - platform: template
    name: "Capacitance"
    entity_category: diagnostic
    id: capacitance
    unit_of_measurement: "pF"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never

  # Wetting in percent for display, points from RC-SPC1K datasheet table 1.
  - platform: copy
    source_id: capacitance
    name: "Wetness"
    icon: mdi:water-percent
    unit_of_measurement: "%"
    device_class: ""
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - lambda: |-
          //                pF     %
          static const float P[][2] = {
            { 100.0f,   0.0f },   // dry
            { 180.0f,  25.0f },
            { 280.0f,  40.0f },
            { 390.0f,  50.0f },
            { 550.0f, 100.0f },
          };
          const int N = sizeof(P) / sizeof(P[0]);
          if (isnan(x)) return NAN;
          if (x <= P[0][0]) return 0.0f;
          for (int i = 1; i < N; i++) {
            if (x <= P[i][0]) {
              float f = (x - P[i-1][0]) / (P[i][0] - P[i-1][0]);
              return P[i-1][1] + f * (P[i][1] - P[i-1][1]);
            }
          }
          return 100.0f;

  # Rate in pF/min from real time; published by the frequency on_value.
  - platform: template
    name: "Capacitance Rate of Change"
    entity_category: diagnostic
    id: capacitance_rate
    unit_of_measurement: "pF/min"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never
    filters:
      # One raw value per 10 s; 1 min mean.
      - sliding_window_moving_average:
          window_size: 6
          send_every: 1

  - platform: template
    name: "Heating Account"
    unit_of_measurement: "min"
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 30s
    entity_category: diagnostic
    lambda: 'return id(g_heat_sec) / 60.0f;'

  - platform: template
    name: "Lockout Remaining"
    unit_of_measurement: "min"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 30s
    entity_category: diagnostic
    lambda: 'return id(g_lockout_sec) / 60.0f;'

  # Outdoor air from Home Assistant (optional, see substitutions).
  - platform: homeassistant
    id: outdoor_temperature
    entity_id: ${outdoor_temp_entity}
    internal: true

  - platform: homeassistant
    id: outdoor_humidity
    entity_id: ${outdoor_humidity_entity}
    internal: true

  - platform: template
    name: "Dew Point"
    id: dew_point
    entity_category: diagnostic
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 15s
    lambda: |-
      float t = NAN, rh = NAN;

      // 1) Values pushed via the API action while fresh (0 = none yet).
      uint32_t st = id(g_push_stamp);
      if (st != 0 && (millis() - st) < ${outdoor_valid_ms}) {
        t  = id(g_push_temp);
        rh = id(g_push_rh);
      }

      // 2) Otherwise the subscribed entities.
      if (isnan(t) || isnan(rh)) {
        t  = id(outdoor_temperature).state;
        rh = id(outdoor_humidity).state;
      }

      if (isnan(t) || isnan(rh) || rh <= 0.0f) return NAN;
      float a = logf(rh / 100.0f) + (17.62f * t) / (243.12f + t);
      return 243.12f * a / (17.62f - a);

  # Surface minus dew point: at or below zero, water condenses. Below 0 C on
  # the surface the frost point (Magnus over ice) is used, up to ~1 K higher.
  - platform: template
    name: "Distance to Dew Point"
    entity_category: diagnostic
    unit_of_measurement: "°C"
    device_class: temperature_delta
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 15s
    lambda: |-
      float ts = id(temp_smoothed).state;
      float td = id(dew_point).state;
      if (!isnan(ts) && !isnan(td) && ts <= 0.0f && td < 0.0f) {
        float g = 17.62f * td / (243.12f + td);
        td = 272.62f * g / (22.46f - g);
      }
      float d = (isnan(ts) || isnan(td)) ? NAN : (ts - td);
      id(g_dew_point_distance) = d;
      return d;

  - platform: wifi_signal
    name: "WiFi Signal"
    entity_category: diagnostic
    update_interval: 120s

  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic

  # Optional weather modules, prepared on the board but untested: uncomment
  # and check address/pins. Expansion header J8: IO32, IO33, IO26, IO27, IO14, IO4.
  #
  # # Pressure, temperature, humidity (I2C 0x76; BMP280: bmp280_i2c).
  # - platform: bme280_i2c
  #   address: 0x76
  #   update_interval: 8s
  #   temperature:
  #     name: "Outdoor Temperature"
  #   pressure:
  #     name: "Pressure"
  #   humidity:
  #     name: "Outdoor Humidity"
  #
  # # UV (I2C 0x53).
  # - platform: ltr390
  #   address: 0x53
  #   update_interval: 8s
  #   uv_index:
  #     name: "UV Index"
  #
  # # Cup anemometer, reed contact to GND (2.4 km/h per pulse/s is common).
  # - platform: pulse_counter
  #   pin:
  #     number: GPIO27
  #     mode: INPUT_PULLUP
  #   name: "Wind"
  #   unit_of_measurement: "km/h"
  #   update_interval: 10s
  #   filters:
  #     - multiply: 0.04   # pulses/min -> km/h
  #
  # # Wind vane (resistor network to GND, pull-up to 3V3): raw voltage, map it
  # # to directions for your vane. ADC1 pin, so it works with WiFi.
  # - platform: adc
  #   pin: GPIO33
  #   name: "Wind Vane Voltage"
  #   attenuation: 12db
  #   update_interval: 10s
  #
  # # Tipping bucket, reed contact to GND (0.2794 mm per tip is common).
  # # Tips during night-mode sleep are lost: do not combine with night mode.
  # - platform: pulse_counter
  #   pin:
  #     number: GPIO26
  #     mode: INPUT_PULLUP
  #   name: "Rain Rate"
  #   unit_of_measurement: "mm/h"
  #   update_interval: 60s
  #   filters:
  #     - multiply: 16.764  # tips/min -> mm/h
  #   total:
  #     name: "Rain Amount"
  #     unit_of_measurement: "mm"
  #     filters:
  #       - multiply: 0.2794


binary_sensor:
  - platform: template
    name: "Humid"
    device_class: moisture
    entity_category: diagnostic
    lambda: |-
      if (isnan(id(capacitance).state) || isnan(id(threshold_humid).state)) return {};
      return id(g_humid);

  # Follows the rain latch, not the raw threshold: heavy dew reaches the same
  # capacitance as rain. Stays on during the heater test after a rain end,
  # so steady rain does not report a false end.
  - platform: template
    name: "Rain"
    device_class: moisture
    lambda: 'return id(g_rain) || id(g_rain_ended);'

  - platform: template
    name: "Heating Lockout Active"
    device_class: problem
    lambda: 'return id(g_lockout_sec) > 0;'


switch:
  # Boost enable + heater MOSFET. ALWAYS_OFF: a crash while heating must not
  # end in a permanently running heater.
  - platform: gpio
    pin: ${pin_heater}
    id: heater
    name: "Heater"
    icon: mdi:radiator
    restore_mode: ALWAYS_OFF

  # Veto against night mode (keeps the device reachable, e.g. for OTA).
  # Off by default: enable only when the supply does not cut out at low load.
  - platform: template
    name: "Night Mode"
    id: night_sleep_veto
    icon: mdi:sleep
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config

  # Master switch for heating automation and night mode. Defaults to ON
  # (a forgotten OFF is the costlier error); not ALWAYS_ON, so a deliberate
  # OFF survives deep-sleep wakeups.
  - platform: template
    name: "Auto Mode"
    id: auto_mode
    icon: mdi:auto-mode
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    # Turning it on clears a running lockout.
    on_turn_on:
      - lambda: |-
          id(g_heat_sec) = 0.0f;
          id(g_lockout_sec) = 0;


text_sensor:
  # Weather state. Capacitance says how wet, rate and dew point say why:
  #   dry       below the display threshold
  #   humid     thin film, not growing
  #   wet       wet surface, not growing (also right after rain)
  #   Drizzle   precipitation latch below rain
  #   Rain      rain latch, or drying after a rain end at rain level
  #   Dew       surface at or below the dew point (without one: slow wetting
  #             in the dark), above 0 °C (Morning Dew 04-11 h, Evening Dew 17-23 h)
  #   Frost     same, at or below 0 °C
  - platform: template
    name: "Weather State"
    icon: mdi:weather-partly-rainy
    update_interval: 15s
    lambda: |-
      float c  = id(capacitance).state;
      float sa = id(threshold_display).state;
      float sf = id(threshold_humid).state;
      // No value yet (boot, wake from night mode): keep the last state.
      if (isnan(c) || isnan(sf)) return {};
      // Display threshold above the heating threshold: only sf applies.
      if (isnan(sa) || sa > sf) sa = sf;

      // Latches are kept by the control loop, only read here.
      id(g_display) = id(g_display) ? c >= sa * ${hyst_factor} : c >= sa;
      bool rain = id(g_rain) || id(g_rain_ended);
      if (rain || id(g_drizzle) || !id(g_display)) id(g_dew) = false;
      if (rain)        return {"Rain"};
      if (!id(g_display))   return {"dry"};
      if (id(g_drizzle)) return {"Drizzle"};

      // Dew from the threshold down.
      float dp = id(g_dew_point_distance);
      float ts = id(temp_smoothed).state;
      bool dew;
      if (!isnan(dp)) {
        float st = id(threshold_dew).state;
        dew = id(g_dew) ? dp <= st + ${hyst_dew} : dp <= st;
      } else {
        // Fallback: slow wetting (no precipitation latch) in the dark.
        float lux = id(brightness).state;
        dew = !isnan(lux) && lux < ${lux_night};
      }
      id(g_dew) = dew;
      if (dew) {
        if (!isnan(ts) && ts <= 0.0f) return {"Frost"};
        auto t = id(ha_time).now();
        if (t.is_valid() && t.hour >= 4 && t.hour < 11) return {"Morning Dew"};
        if (t.is_valid() && t.hour >= 17 && t.hour < 23) return {"Evening Dew"};
        return {"Dew"};
      }

      // Fog (untested, off): saturated outdoor air, surface near air temperature.
      // float ta = NAN, rh = NAN;
      // if (id(g_push_stamp) != 0 && (millis() - id(g_push_stamp)) < ${outdoor_valid_ms}) { ta = id(g_push_temp); rh = id(g_push_rh); }
      // if (isnan(ta) || isnan(rh)) { ta = id(outdoor_temperature).state; rh = id(outdoor_humidity).state; }
      // if (!isnan(ta) && !isnan(rh) && !isnan(ts) && rh >= 97.0f && fabsf(ts - ta) < 1.0f) return {"Fog"};

      return id(g_humid) ? std::string("wet") : std::string("humid");

  - platform: version
    name: "ESPHome Version"
    entity_category: diagnostic
    disabled_by_default: true


# Control loop every second (the heater raises the surface ~0.7 K/s).
# Order: 0a precipitation latches, 0b elapsed time, 1 safety cut-off,
# 2 manual mode, 3 wet state, 4 heating limit, 5 heater test, 6 switch.
interval:
  - interval: 1s
    then:
      - lambda: |-
          float t  = id(sensor_temperature).state;
          bool  heater_on = id(heater).state;
          float c  = id(capacitance).state;
          float sr = id(threshold_rain).state;
          auto  now = id(ha_time).now();

          // 0a) Precipitation latches. Level alone cannot separate rain from
          // dew (dense condensate reaches rain levels), but precipitation
          // rises ~100x faster and dew forms only at or below the dew point.
          //   Drizzle: rise >= "Drizzle Detection".
          //   Rain:    rain level plus a rise >= "Rain Detection", or a
          //            surface clearly above the dew point.
          // Both end when the rate stays below rate_steady for
          // "Rain End After" (the heater then dries the surface) or when the
          // level falls back.
          // Runs first so it also runs in manual mode.
          if (!isnan(c) && !isnan(sr)) {
            float rr = id(capacitance_rate).state;
            float rn = id(rate_drizzle).state;
            float rg = id(rate_rain).state;
            float dp = id(g_dew_point_distance);
            float sa = id(threshold_display).state;

            bool latched_before = id(g_drizzle) || id(g_rain);
            if (!isnan(rr) && !isnan(rn) && rr >= rn) id(g_drizzle) = true;
            if (c >= sr && !id(g_rain)) {
              bool fast   = !isnan(rr) && !isnan(rg) && rr >= rg;
              bool above_dew = !isnan(dp) && dp > 0.5f;
              // After a rain end only a new fast rise counts.
              if (fast || (above_dew && !id(g_rain_ended))) {
                id(g_rain) = true;
                id(g_rain_ended) = false;
              }
            }

            if (c < sr * 0.9f) {
              id(g_rain) = false;
              id(g_rain_ended) = false;
            }
            if (!isnan(sa) && c < sa) id(g_drizzle) = false;
            // A new latch starts a new steady period.
            if (!latched_before && (id(g_drizzle) || id(g_rain))) id(g_steady_since) = 0;

            // Steady level (needs the clock, works across night-mode sleep).
            if (!isnan(rr) && now.is_valid()) {
              uint32_t since = id(g_steady_since);
              float end_min = id(rain_end_min).state;
              if (rr >= ${rate_steady}) {
                id(g_steady_since) = 0;
              } else if (since == 0 || now.timestamp < since) {
                id(g_steady_since) = now.timestamp;
              } else if (!isnan(end_min) && now.timestamp - since >= (uint32_t)(end_min * 60.0f)) {
                if (id(g_rain)) id(g_rain_ended) = true;
                id(g_rain)  = false;
                id(g_drizzle) = false;
              }
            }
          }

          // Heating threshold with hysteresis, shared with the state text and
          // the "Humid" sensor; runs before any early return.
          float sfh = id(threshold_humid).state;
          if (!isnan(c) && !isnan(sfh))
            id(g_humid) = id(g_humid) ? c >= sfh * ${hyst_factor} : c >= sfh;

          // 0b) Elapsed time. Account and lockout run in real time: in night
          // mode this loop stalls (35 s awake per 5 min). Without a clock
          // it falls back to one second per run.
          float dt = 1.0f;
          if (now.is_valid()) {
            uint32_t now_ts = now.timestamp;
            uint32_t prev_ts = id(g_account_stamp);
            if (prev_ts != 0 && now_ts >= prev_ts) {
              // May be 0 (two runs in the same second); cap time jumps.
              dt = (float)(now_ts - prev_ts);
              if (dt > 3600.0f) dt = 3600.0f;
            }
            id(g_account_stamp) = now_ts;
          }

          // Heater account: up while heating, decays in pauses.
          float recovery_min = id(recovery).state;
          if (isnan(recovery_min) || recovery_min < 1.0f) recovery_min = 1.0f;
          if (heater_on) id(g_heat_sec) += dt;
          else         id(g_heat_sec) -= dt / recovery_min;
          if (id(g_heat_sec) < 0.0f) id(g_heat_sec) = 0.0f;

          if (id(g_lockout_sec) > 0 && dt >= 1.0f) {
            uint32_t elapsed = (uint32_t) dt;
            if (id(g_lockout_sec) > elapsed) {
              id(g_lockout_sec) -= elapsed;
            } else {
              id(g_lockout_sec) = 0;
              id(g_heat_sec)   = 0.0f;
            }
          }

          // 1) Safety, always (also manual). NaN includes an implausible
          // resistance, i.e. a wiring fault.
          if (isnan(t) || t >= ${temp_off}) {
            if (heater_on) id(heater).turn_off();
            return;
          }

          // 2) Manual mode: no further intervention (also skips the heating
          // limit; the temperature cut-off above still applies).
          if (!id(auto_mode).state) return;

          // 3) Heat when wet, never during precipitation (the sensor has to
          // see it, and the heater cannot keep up with rain).
          if (isnan(c) || isnan(sr) || isnan(sfh)) {
            if (heater_on) id(heater).turn_off();
            return;
          }
          bool desired = id(g_humid) && !id(g_rain) && !id(g_drizzle);

          // 4) Heating limit: in fog the surface gets wet faster than it
          // dries. Exceeding the maximum triggers a fixed pause.
          float maxd = id(max_heat_duration).state;
          float cooldown_min = id(cooldown).state;
          if (!isnan(maxd) && !isnan(cooldown_min) &&
              id(g_lockout_sec) == 0 && id(g_heat_sec) >= maxd * 60.0f) {
            id(g_lockout_sec) = (uint32_t)(cooldown_min * 60.0f);
          }
          if (id(g_lockout_sec) > 0) {
            if (heater_on) id(heater).turn_off();
            id(g_drying_sec) = 0.0f;
            return;
          }

          // 5) Heater test after a rain end: still at the rain level after
          // rain_heater_test seconds of drying = it is still raining.
          if (desired && id(g_rain_ended)) {
            id(g_drying_sec) += dt;
            if (c >= sr && id(g_drying_sec) >= ${rain_heater_test}) {
              id(g_rain) = true;
              id(g_rain_ended) = false;
              id(g_steady_since) = 0;
              desired = false;
            }
          } else {
            id(g_drying_sec) = 0.0f;
          }

          // 6) Switch on change. Temperature hysteresis: after the cut-off,
          // switch on again only at or below temp_on; switching off is
          // never delayed.
          if (desired && !heater_on && t > ${temp_on}) return;
          if (desired != heater_on) {
            if (desired) id(heater).turn_on();
            else      id(heater).turn_off();
          }

  # Night mode. Sleep only if all conditions hold; otherwise stay awake
  # (a sleeping device is unreachable and does not measure).
  - interval: 5s
    then:
      - if:
          condition:
            and:
              - switch.is_on: auto_mode
              - switch.is_on: night_sleep_veto
              - switch.is_off: heater
              # Minimum wake time: first capacitance cycle and OTA window.
              - lambda: 'return millis() > ${sleep_wake_time};'
              - lambda: |-
                  float f_from = id(sleep_from).state;
                  float f_until = id(sleep_until).state;
                  if (isnan(f_from) || isnan(f_until)) return false;
                  int start_half = (int) roundf(f_from * 2);
                  int end_half = (int) roundf(f_until * 2);
                  if (start_half == end_half) return false;            // empty window

                  auto now_time = id(ha_time).now();
                  if (now_time.is_valid()) {
                    int h = now_time.hour * 2 + (now_time.minute >= 30 ? 1 : 0);
                    bool inside = (start_half < end_half) ? (h >= start_half && h < end_half)
                                            : ((h >= start_half) || (h < end_half));
                    id(g_night) = inside;
                    return inside;
                  }

                  // No valid clock (time comes from HA, so it fails with
                  // WiFi): after 2 min use the last known state, otherwise
                  // the device would stay awake all night and drain the
                  // battery.
                  return id(g_night) && millis() > 120000;
          then:
            - logger.log: "Night window, going to sleep"
            - deep_sleep.enter: night_sleep
