# RC-SPC1KA capacitive rain sensor on rain-sensor-board (ESP32-WROOM-32E, ESPHome).
# Hardware: ../README.md. secrets.yaml needs wifi_ssid, wifi_password,
# rain_sensor_api_key.
# Calibrate: read the dry "Frequency", enter it as "Dry Frequency", then tune thresholds.

substitutions:
  name: rain-sensor
  friendly_name: Rain Sensor

  pin_i2c_sda: GPIO21
  pin_i2c_scl: GPIO22
  pin_heater: GPIO13    # boost enable + heater MOSFET
  gpio_c_freq: GPIO25    # oscillator input (hardware PCNT)
  pin_ntc: GPIO34        # GPIO32 if solder jumper SJ1 is moved
  pin_batt_adc: GPIO35   # J1 BAT via 100k/100k divider

  batt_divider_factor: "2.0"

  # NTC divider: 3V3 --[r_pullup]-- ADC --[NTC]-- GND. Permanently on 3V3
  # (0.87 mA with 2x 5.6k parallel); change only if R2/R3 differ.
  r_pullup: "2800"
  # ADC gain trim. Compare against a reference thermometer (same air, no sun,
  # heater off >= 30 min), then adjust; keep "NTC Offset" at 0.
  adc_factor: "1.0"

  # Plausible NTC range; outside = fault, heater off (open wire / short).
  ntc_r_min: "80"        # ~108 C
  ntc_r_max: "13000"     # ~-29 C
  temp_off: "45.0"       # heater off
  temp_on: "40.0"       # heater may switch on again

  # Capacitance: C = Dry Frequency * 100 / f (dry frequency = 100 pF).
  # The runtime number "Dry Frequency" overrides this start value.
  # Typical for the carrier board with the sensor cable; measure your own.
  c_freq_reference_start: "35000.0"
  c_stalled: "10000.0"      # pF reported while the oscillator stalls

  # Precipitation: rise thresholds are runtime numbers ("Drizzle Detection",
  # "Rain Detection"; dew and fog rise a few pF/min). Below rate_steady the
  # level counts as steady for "Rain End After".
  rate_steady: "10"       # pF/min
  # No drizzle while the plate cools (after heating or when the sun goes):
  # it takes up humidity again at up to ~40 pF/min.
  drizzle_hold_s: "420"   # after heating
  cooling_k: "2.0"         # K below the peak of the last 5-10 min (cooling_s windows)
  cooling_s: "300"
  # Stalled oscillator: heat at most this long per stall to dry the leak, then wait.
  stall_heat_max_s: "600"
  # After a rain end the heater dries the surface. Still at the rain level
  # after this many seconds of drying = still raining, rain is set again.
  rain_heater_test: "180"  # s

  # The running heater disturbs the oscillator: samples are dropped while it
  # runs and for meas_hold_s after; it then stays off at least meas_pause_s
  # so a clean reading comes in.
  meas_hold_s: "12"
  meas_pause_s: "25"
  # Longest heating pulse, for when the plate does not reach temp_off.
  heat_pulse_max_s: "60"

  # The heater runs down to this share of the heating threshold: fewer, longer pulses.
  hyst_heater: "0.85"

  # Weather state texts; index stored across sleep (see on_boot).
  ws_names: '"dry", "Drizzle", "Rain"'

  # Night mode (deep sleep, RTC timer wake).
  sleep_interval: 5min
  sleep_wake_time: "35000"      # ms awake before sleeping


esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  # After a wake from night mode, report the last weather state at once
  # instead of "unknown" until the first measurement.
  on_boot:
    priority: -100
    then:
      - lambda: |-
          static const char *const N[] = {${ws_names}};
          int i = id(g_weather);
          if (i >= 0 && i < (int)(sizeof(N) / sizeof(N[0]))) id(weather_state).publish_state(N[i]);

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:
  encryption:
    key: !secret rain_sensor_api_key

ota:
  - platform: esphome
    encryption:
    on_begin:
      then:
        - deep_sleep.prevent: night_sleep

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: light
  ap:
    ssid: "${friendly_name} Fallback"

captive_portal:

# Night window needs valid time; without it the device never sleeps.
time:
  - platform: homeassistant
    id: ha_time

# Sleep is triggered only by the interval at the bottom.
deep_sleep:
  id: night_sleep
  sleep_duration: ${sleep_interval}

i2c:
  sda: ${pin_i2c_sda}
  scl: ${pin_i2c_scl}
  frequency: 100kHz

# restore_value goes to NVS flash; synced every 15 min and before deep sleep.
preferences:
  flash_write_interval: 15min

globals:
  # Previous capacitance for the rate; persisted across sleep.
  - id: c_previous
    type: float
    restore_value: true
    initial_value: 'NAN'

  # Heater account in seconds: rises while heating, decays in pauses.
  # Persisted, otherwise the limit cannot act across night-mode wakeups.
  - id: g_heat_sec
    type: float
    restore_value: true
    initial_value: '0.0'

  # Remaining lockout in seconds.
  - id: g_lockout_sec
    type: uint32_t
    restore_value: true
    initial_value: '0'

  # Unix time of the last capacitance sample (millis() restarts after sleep).
  - id: g_rate_stamp
    type: uint32_t
    restore_value: true
    initial_value: '0'

  # Precipitation latches (set by a fast rise, see the control loop), so dew
  # is not reported as rain and the heater stays off while it rains.
  - id: g_rain
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: g_drizzle
    type: bool
    restore_value: true
    initial_value: 'false'
  # Rain released by "Rain End After" while still above the rain level: only
  # a new fast rise or the heater test sets it again.
  - id: g_rain_ended
    type: bool
    restore_value: true
    initial_value: 'false'
  # Unix time since the level is steady (0 = rising).
  - id: g_steady_since
    type: uint32_t
    restore_value: true
    initial_value: '0'
  # Seconds of drying after a rain end (heater test).
  - id: g_drying_sec
    type: float
    initial_value: '0.0'

  # Unix time of the last control-loop run (account and lockout use real time).
  - id: g_account_stamp
    type: uint32_t
    restore_value: true
    initial_value: '0'

  # Capacitance at or above the heating threshold (hysteresis hyst_heater).
  - id: g_humid
    type: bool
    restore_value: true
    initial_value: 'false'

  # Last published weather state (index into ws_names, -1 = none).
  - id: g_weather
    type: int
    restore_value: true
    initial_value: '-1'

  # millis() of the last second with the heater on (sample hold).
  - id: g_off_ms
    type: uint32_t
    initial_value: '0'
  # millis() at heater switch-on (pulse limit).
  - id: g_pulse_ms
    type: uint32_t
    initial_value: '0'

  # Unix time of the last loop run with the heater on (drizzle pause).
  - id: g_heater_ts
    type: uint32_t
    restore_value: true
    initial_value: '0'

  # Surface temperature peaks of the current and previous window (cooling check for drizzle).
  - id: g_t_peak
    type: float
    initial_value: 'NAN'
  - id: g_t_peak_prev     # peak of the previous window
    type: float
    initial_value: 'NAN'
  - id: g_t_window        # current window (unix time / cooling_s)
    type: uint32_t
    initial_value: '0'

  # Oscillator stalled (0 Hz or c at or above c_stalled): leakage, not a reading.
  - id: g_stalled
    type: bool
    restore_value: true   # a night-mode wake must not reset the stall budget below
    initial_value: 'false'
  # Heating seconds during the current stall (persisted across night-mode sleep).
  - id: g_stall_heat
    type: float
    restore_value: true
    initial_value: '0.0'

  # Last known "inside night window", fallback when the clock is missing.
  - id: g_night
    type: bool
    restore_value: true
    initial_value: 'false'


# Runtime thresholds; initial_value applies only on the first boot. Tune them
# to your setup.
number:
  # Dry frequency of your setup = 100 pF. Read "Frequency" with a completely
  # dry surface and enter the mean here. "Capacitance" stays NAN without it.
  - platform: template
    name: "Dry Frequency"
    id: freq_reference
    unit_of_measurement: "Hz"
    min_value: 1000
    max_value: 100000
    step: 1
    initial_value: ${c_freq_reference_start}
    # A new reference shifts the capacitance in one step: restart the rate.
    # set_action runs only on a user change, not on the restore at each boot.
    set_action:
      - lambda: 'id(c_previous) = NAN;'
    <<: &number_cfg
      restore_value: true
      optimistic: true
      mode: box
      entity_category: config

  # VEML7700 sits behind a cover; this compensates for its attenuation.
  # Factor = lux without cover / lux behind it, read right after each other.
  - platform: template
    name: "Glass Factor"
    id: glass_factor
    unit_of_measurement: "x"
    min_value: 1
    max_value: 10
    step: 0.1
    initial_value: 1.0
    <<: *number_cfg

  # From here the automation heats ("Humid" turns on), unless it rains or drizzles.
  # Keep it above the dew level: heating dew at night only wastes energy.
  - platform: template
    name: "Humidity Threshold"
    id: threshold_humid
    unit_of_measurement: "pF"
    min_value: 100
    max_value: 1500
    step: 10
    initial_value: 300
    <<: *number_cfg

  # Rain level: rain needs this level plus a fast rise ("Rain Detection") or drizzle.
  - platform: template
    name: "Rain Threshold"
    id: threshold_rain
    unit_of_measurement: "pF"
    min_value: 200
    max_value: 5000
    step: 50
    initial_value: 500
    <<: *number_cfg

  # Rise that counts as precipitation; also blocks the heater.
  - platform: template
    name: "Drizzle Detection"
    id: rate_drizzle
    unit_of_measurement: "pF/min"
    min_value: 5
    max_value: 500
    step: 1
    initial_value: 18
    <<: *number_cfg

  - platform: template
    name: "Rain Detection"
    id: rate_rain
    unit_of_measurement: "pF/min"
    min_value: 20
    max_value: 1000
    step: 10
    initial_value: 150
    <<: *number_cfg

  # Drizzle and rain end after this long without a rise.
  - platform: template
    name: "Rain End After"
    id: rain_end_min
    unit_of_measurement: "min"
    min_value: 1
    max_value: 60
    step: 1
    initial_value: 7
    <<: *number_cfg

  # Heating limit against continuous fog/drizzle.
  - platform: template
    name: "Max. Heating Time"
    id: max_heat_duration
    unit_of_measurement: "min"
    min_value: 5
    max_value: 30
    step: 1
    initial_value: 15
    <<: *number_cfg

  # Night window in half hours (22.5 = 22:30), may span midnight. Equal values = never sleep.
  - platform: template
    name: "Night Mode From"
    id: sleep_from
    unit_of_measurement: "h"
    min_value: 0
    max_value: 23.5
    step: 0.5
    initial_value: 22
    <<: *number_cfg

  - platform: template
    name: "Night Mode Until"
    id: sleep_until
    unit_of_measurement: "h"
    min_value: 0
    max_value: 23.5
    step: 0.5
    initial_value: 5
    <<: *number_cfg

  # Pause minutes per heating minute: duty limit 1/(1+x), 6 -> 14 %.
  - platform: template
    name: "Pause per Heating Minute"
    id: recovery
    unit_of_measurement: "min"
    min_value: 1
    max_value: 20
    step: 1
    initial_value: 6
    <<: *number_cfg

  - platform: template
    name: "Heating Pause"
    id: cooldown
    unit_of_measurement: "min"
    min_value: 30
    max_value: 1440
    step: 30
    initial_value: 120
    <<: *number_cfg

  # Fine trim of the surface temperature (coarse: adc_factor). Calibrate
  # against air temperature in the daytime: at night the plate is colder.
  - platform: template
    name: "NTC Offset"
    id: ntc_offset
    unit_of_measurement: "K"
    min_value: -5
    max_value: 5
    step: 0.1
    initial_value: 0
    <<: *number_cfg


sensor:
  # I2C sensors at 8 s so they report within the 35 s night-mode wake time.
  - platform: veml7700
    address: 0x10
    update_interval: 8s
    ambient_light:
      name: "Brightness"
      id: brightness
      accuracy_decimals: 1
      filters:
        - lambda: 'return x * id(glass_factor).state;'

  # Rough lux -> W/m2 for daylight; not used by the classification.
  - platform: copy
    source_id: brightness
    name: "Solar Irradiance"
    unit_of_measurement: "W/m²"
    device_class: irradiance
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - multiply: 0.01

  # HTU21D inside the enclosure: battery climate (no charging below 0 °C)
  # and desiccant check.
  - platform: htu21d
    address: 0x40
    update_interval: 8s
    temperature:
      name: "Box Temperature"
      entity_category: diagnostic
      accuracy_decimals: 1
    humidity:
      name: "Box Humidity"
      entity_category: diagnostic
      accuracy_decimals: 1

  # NTC chain: ADC -> resistance -> temperature.
  - platform: adc
    pin: ${pin_ntc}
    id: ntc_adc
    attenuation: 12db
    update_interval: 1s
    internal: true
    samples: 16
    filters:
      - multiply: ${adc_factor}
      - median:
          window_size: 3
          send_every: 1
      # ~3 s time constant: display lags ~1 K while heating.
      - exponential_moving_average:
          alpha: 0.3
          send_every: 1

  # Battery voltage (Waveshare Solar Power Manager D) on J1 BAT.
  - platform: adc
    pin: ${pin_batt_adc}
    attenuation: 12db
    update_interval: 30s
    samples: 16
    filters:
      - multiply: ${batt_divider_factor}
      - exponential_moving_average:
          alpha: 0.2
          send_every: 1
    name: "Battery Voltage"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 2
    entity_category: diagnostic

  - platform: resistance
    sensor: ntc_adc
    id: ntc_resistance
    name: "NTC Resistance"
    configuration: DOWNSTREAM
    resistor: ${r_pullup}Ohm
    reference_voltage: 3.3V
    unit_of_measurement: "Ω"
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic
    filters:
      - lambda: |-
          if (x < ${ntc_r_min} || x > ${ntc_r_max}) return NAN;
          return x;

  # Fast, internal: drives the heater cut-off every second.
  - platform: ntc
    sensor: ntc_resistance
    id: sensor_temperature
    internal: true
    calibration:
      - 3572Ohm -> -5°C
      - 1000Ohm -> 25°C
      - 290Ohm -> 60°C
    filters:
      - lambda: |-
          float o = id(ntc_offset).state;
          return isnan(o) ? x : x + o;

  # Smoothed copy for HA (15 s mean, new value every 5 s).
  - platform: copy
    source_id: sensor_temperature
    name: "Surface Temperature"
    accuracy_decimals: 1
    filters:
      - sliding_window_moving_average:
          window_size: 15
          send_every: 5
          send_first_at: 5

  # Oscillator frequency. Capacitance and rate are computed here so that the
  # rate uses the true sample spacing.
  - platform: pulse_counter
    pin: ${gpio_c_freq}
    name: "Frequency"
    entity_category: diagnostic
    unit_of_measurement: "Hz"
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 2s
    internal_filter: 2us   # default 13 us cuts off near 38 kHz
    filters:
      - multiply: 0.0166667    # pulses/min -> Hz
      # Median over 5 windows against single bad windows.
      - median:
          window_size: 5
    on_value:
      - lambda: |-
          // Heater on or just off: keep the last reading.
          if (id(heater).state || (id(g_off_ms) != 0 && millis() - id(g_off_ms) < ${meas_hold_s} * 1000UL)) return;
          // Stalled or sputtering oscillator: water at the pads, not a reading.
          // No rate, so the latches cannot fire on it.
          float c_pf;
          float fref = id(freq_reference).state;
          if (isnan(x) || x <= 0.0f) {
            c_pf = ${c_stalled};
          } else if (isnan(fref) || fref <= 0.0f) {
            c_pf = NAN;   // not calibrated
          } else {
            c_pf = fref * 100.0f / x;
          }
          bool stalled = c_pf >= ${c_stalled};
          if (stalled != id(g_stalled))
            ESP_LOGW("capacitance", "%s", stalled ? "Oscillator stalled" : "Oscillator running again");
          id(g_stalled) = stalled;
          if (stalled) c_pf = ${c_stalled};
          id(capacitance).publish_state(c_pf);

          float rate = NAN;
          auto now_time = id(ha_time).now();
          // While stalled keep the last good sample as the rate base.
          if (!stalled && now_time.is_valid()) {
            uint32_t t  = now_time.timestamp;
            float    v  = id(c_previous);
            uint32_t t0 = id(g_rate_stamp);
            id(c_previous)     = c_pf;
            id(g_rate_stamp) = t;
            if (!isnan(v) && t0 != 0 && t > t0) {
              float dt_min = (t - t0) / 60.0f;
              // Gap too large (missed cycles, long sleep): no trend.
              if (dt_min <= 15.0f) rate = (c_pf - v) / dt_min;
            }
          }
          id(capacitance_rate).publish_state(rate);

  - platform: template
    name: "Capacitance"
    entity_category: diagnostic
    id: capacitance
    unit_of_measurement: "pF"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never

  # Wetting in percent for display, points from RC-SPC1K datasheet table 1.
  - platform: copy
    source_id: capacitance
    name: "Wetness"
    icon: mdi:water-percent
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - calibrate_linear:
          method: exact
          datapoints:
            - 100 -> 0     # dry
            - 180 -> 25
            - 280 -> 40
            - 390 -> 50
            - 550 -> 100
      - clamp:
          min_value: 0
          max_value: 100

  # Rate in pF/min from real time; published by the frequency on_value.
  - platform: template
    name: "Capacitance Rate of Change"
    entity_category: diagnostic
    id: capacitance_rate
    unit_of_measurement: "pF/min"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never
    filters:
      # One raw value per 10 s; 1 min mean.
      - sliding_window_moving_average:
          window_size: 6
          send_every: 1

  - platform: template
    name: "Heating Account"
    unit_of_measurement: "min"
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 30s
    entity_category: diagnostic
    lambda: 'return id(g_heat_sec) / 60.0f;'

  - platform: template
    name: "Lockout Remaining"
    unit_of_measurement: "min"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 30s
    entity_category: diagnostic
    lambda: 'return id(g_lockout_sec) / 60.0f;'

  - platform: wifi_signal
    name: "WiFi Signal"
    entity_category: diagnostic
    update_interval: 120s

  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic


binary_sensor:
  - platform: template
    name: "Humid"
    device_class: moisture
    entity_category: diagnostic
    lambda: |-
      if (isnan(id(capacitance).state) || isnan(id(threshold_humid).state)) return {};
      return id(g_humid);

  # Follows the rain latch, not the raw threshold: heavy dew reaches the same
  # capacitance as rain. Stays on during the heater test after a rain end,
  # so steady rain does not report a false end.
  - platform: template
    name: "Rain"
    device_class: moisture
    lambda: 'return id(g_rain) || id(g_rain_ended);'

  - platform: template
    name: "Heating Lockout Active"
    device_class: problem
    lambda: 'return id(g_lockout_sec) > 0;'

  - platform: template
    name: "Oscillator Stalled"
    device_class: problem
    entity_category: diagnostic
    lambda: 'return id(g_stalled);'


switch:
  # Boost enable + heater MOSFET. ALWAYS_OFF: a crash while heating must not
  # end in a permanently running heater.
  - platform: gpio
    pin: ${pin_heater}
    id: heater
    name: "Heater"
    icon: mdi:radiator
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - lambda: 'id(g_pulse_ms) = millis();'

  # Allows night mode; off keeps the device awake and reachable (e.g. for OTA).
  # Off by default: enable only when the supply does not cut out at low load.
  - platform: template
    name: "Night Mode"
    id: night_sleep_veto
    icon: mdi:sleep
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config

  # Master switch for heating automation and night mode. Defaults to ON
  # (a forgotten OFF is the costlier error); not ALWAYS_ON, so a deliberate
  # OFF survives deep-sleep wakeups.
  - platform: template
    name: "Auto Mode"
    id: auto_mode
    icon: mdi:auto-mode
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    # Turning it on clears a running lockout. Not on the restore at boot, or
    # every night-mode wake would clear the heater account.
    on_turn_on:
      - lambda: |-
          if (millis() < 10000) return;
          id(g_heat_sec) = 0.0f;
          id(g_lockout_sec) = 0;


text_sensor:
  # Weather state. Capacitance says how wet, the rise says whether it falls:
  #   dry       no precipitation (dew and fog included)
  #   Drizzle   precipitation latch below rain
  #   Rain      rain latch, or drying after a rain end at rain level
  - platform: template
    name: "Weather State"
    id: weather_state
    icon: mdi:weather-partly-rainy
    update_interval: 15s
    on_value:
      - lambda: |-
          static const char *const N[] = {${ws_names}};
          for (int i = 0; i < (int)(sizeof(N) / sizeof(N[0])); i++)
            if (x == N[i]) id(g_weather) = i;
    lambda: |-
      // No value yet (boot, wake from night mode) or stalled: keep the last state.
      if (isnan(id(capacitance).state) || id(g_stalled)) return {};
      // Latches are kept by the control loop, only read here.
      if (id(g_rain) || id(g_rain_ended)) return {"Rain"};
      if (id(g_drizzle)) return {"Drizzle"};
      return {"dry"};

  - platform: version
    name: "ESPHome Version"
    entity_category: diagnostic
    disabled_by_default: true


# Control loop every second (the heater raises the surface ~0.7 K/s).
# Order: 0a precipitation latches, 0b elapsed time, 1 safety cut-off,
# 2 manual mode, 3 wet state, 4 heating limit, 5 heater test, 6 switch.
interval:
  - interval: 1s
    then:
      - lambda: |-
          float t  = id(sensor_temperature).state;
          bool  heater_on = id(heater).state;
          float c  = id(capacitance).state;
          float sr = id(threshold_rain).state;
          auto  now = id(ha_time).now();
          if (heater_on && now.is_valid()) id(g_heater_ts) = now.timestamp;
          if (heater_on) id(g_off_ms) = millis();
          uint32_t h = id(g_heater_ts);
          bool fresh = heater_on || (h != 0 && now.is_valid() && now.timestamp - h < ${drizzle_hold_s});
          if (!isnan(t) && now.is_valid()) {
            uint32_t w = now.timestamp / ${cooling_s};
            if (w != id(g_t_window)) {
              id(g_t_peak_prev) = (w == id(g_t_window) + 1) ? id(g_t_peak) : NAN;
              id(g_t_peak) = t;
              id(g_t_window) = w;
            } else if (!(t <= id(g_t_peak))) {
              id(g_t_peak) = t;
            }
          }

          // 0a) Precipitation latches. Level alone cannot separate rain from
          // dew or fog, but precipitation rises much faster.
          //   Drizzle: rise >= "Drizzle Detection", not while the plate cools.
          //   Rain:    rain level plus a rise >= "Rain Detection", or drizzle
          //            that reaches the rain level.
          // Both end when the rate stays below rate_steady for
          // "Rain End After" (the heater then dries above its threshold); rain also
          // when the level falls below the rain level.
          // Runs first so it also runs in manual mode. Frozen while stalled.
          if (!isnan(c) && !isnan(sr) && !id(g_stalled)) {
            float rr = id(capacitance_rate).state;
            float rn = id(rate_drizzle).state;
            float rg = id(rate_rain).state;
            bool warm = fresh || fmaxf(id(g_t_peak), id(g_t_peak_prev)) - t >= ${cooling_k};

            bool latched_before = id(g_drizzle) || id(g_rain);
            if (!warm && !isnan(rr) && !isnan(rn) && rr >= rn) id(g_drizzle) = true;
            if (c >= sr && !id(g_rain)) {
              bool fast = !isnan(rr) && !isnan(rg) && rr >= rg;
              // Drizzle grown to the rain level is rain; after a rain end only a new fast rise counts.
              if (fast || (id(g_drizzle) && !id(g_rain_ended))) {
                id(g_rain) = true;
                id(g_rain_ended) = false;
              }
            }

            if (c < sr * 0.9f) {
              id(g_rain) = false;
              id(g_rain_ended) = false;
            }
            // A new latch starts a new steady period.
            if (!latched_before && (id(g_drizzle) || id(g_rain))) id(g_steady_since) = 0;

            // Steady level (needs the clock, works across night-mode sleep).
            if (!isnan(rr) && now.is_valid()) {
              uint32_t since = id(g_steady_since);
              float end_min = id(rain_end_min).state;
              if (rr >= ${rate_steady}) {
                id(g_steady_since) = 0;
              } else if (since == 0 || now.timestamp < since) {
                id(g_steady_since) = now.timestamp;
              } else if (!isnan(end_min) && now.timestamp - since >= (uint32_t)(end_min * 60.0f)) {
                if (id(g_rain)) id(g_rain_ended) = true;
                id(g_rain)  = false;
                id(g_drizzle) = false;
              }
            }
          }

          // Heating threshold with hysteresis (also "Humid"); before any early return.
          float sfh = id(threshold_humid).state;
          if (!isnan(c) && !isnan(sfh))
            id(g_humid) = id(g_humid) ? c >= sfh * ${hyst_heater} : c >= sfh;

          // 0b) Elapsed time. Account and lockout run in real time: in night
          // mode this loop stalls (35 s awake per 5 min). Without a clock
          // it falls back to one second per run.
          float dt = 1.0f;
          if (now.is_valid()) {
            uint32_t now_ts = now.timestamp;
            uint32_t prev_ts = id(g_account_stamp);
            if (prev_ts != 0 && now_ts >= prev_ts) {
              // May be 0 (two runs in the same second); cap time jumps.
              dt = (float)(now_ts - prev_ts);
              if (dt > 3600.0f) dt = 3600.0f;
            }
            id(g_account_stamp) = now_ts;
          }

          // Heater account: up while heating, decays in pauses.
          float recovery_min = id(recovery).state;
          if (isnan(recovery_min) || recovery_min < 1.0f) recovery_min = 1.0f;
          if (heater_on) id(g_heat_sec) += dt;
          else         id(g_heat_sec) -= dt / recovery_min;
          if (id(g_heat_sec) < 0.0f) id(g_heat_sec) = 0.0f;
          // Leak episode: stalled, or running again but still above the heating
          // level (a sputtering oscillator must not restart the stall budget).
          // Ends only on a reading after the plate has cooled: heat dries the leak for a moment.
          bool leak = id(g_stalled) || id(g_stall_heat) > 0.0f;
          if (!id(g_stalled) && !id(g_humid) && !fresh) id(g_stall_heat) = 0.0f;
          else if (heater_on && leak) id(g_stall_heat) += dt;

          if (id(g_lockout_sec) > 0 && dt >= 1.0f) {
            uint32_t elapsed = (uint32_t) dt;
            if (id(g_lockout_sec) > elapsed) {
              id(g_lockout_sec) -= elapsed;
            } else {
              id(g_lockout_sec) = 0;
              id(g_heat_sec)   = 0.0f;
            }
          }

          // 1) Safety, always (also manual). NaN includes an implausible
          // resistance, i.e. a wiring fault.
          if (isnan(t) || t >= ${temp_off}) {
            if (heater_on) id(heater).turn_off();
            if (isnan(t)) id(g_rain_ended) = false;   // no heater test possible
            return;
          }

          // 2) Manual mode: no further intervention (also skips the heating
          // limit; the temperature cut-off above still applies).
          if (!id(auto_mode).state) {
            id(g_rain_ended) = false;   // no heater test in manual mode
            return;
          }

          // 3) Heat when wet, never during precipitation (the sensor has to
          // see it, and the heater cannot keep up with rain). Dew stays below
          // the heating threshold. After a rain end the surface is always dried.
          if (isnan(c) || isnan(sr) || isnan(sfh)) {
            if (heater_on) id(heater).turn_off();
            return;
          }
          // Leak: one drying attempt of stall_heat_max_s, then wait (battery).
          bool desired = id(g_humid) && (leak ? id(g_stall_heat) < ${stall_heat_max_s}
                                            : (!id(g_rain) && !id(g_drizzle)));

          // 4) Heating limit: in fog the surface gets wet faster than it
          // dries. Exceeding the maximum triggers a fixed pause.
          float maxd = id(max_heat_duration).state;
          float cooldown_min = id(cooldown).state;
          if (!isnan(maxd) && !isnan(cooldown_min) &&
              id(g_lockout_sec) == 0 && id(g_heat_sec) >= maxd * 60.0f) {
            id(g_lockout_sec) = (uint32_t)(cooldown_min * 60.0f);
          }
          if (id(g_lockout_sec) > 0) {
            if (heater_on) id(heater).turn_off();
            id(g_drying_sec) = 0.0f;
            id(g_rain_ended) = false;   // no heater test during the lockout
            return;
          }

          // 5) Heater test after a rain end: still at the rain level after
          // rain_heater_test seconds of drying = it is still raining.
          if (desired && id(g_rain_ended) && !leak) {
            id(g_drying_sec) += dt;
            if (c >= sr && id(g_drying_sec) >= ${rain_heater_test}) {
              id(g_rain) = true;
              id(g_rain_ended) = false;
              id(g_steady_since) = 0;
              desired = false;
            }
          } else {
            id(g_drying_sec) = 0.0f;
          }

          // 6) Switch on change. Temperature hysteresis: after the cut-off,
          // switch on again only at or below temp_on; switching off is
          // never delayed. Off at least meas_pause_s for a clean reading.
          if (heater_on && millis() - id(g_pulse_ms) >= ${heat_pulse_max_s} * 1000UL) desired = false;
          if (desired && !heater_on && (t > ${temp_on} ||
              (id(g_off_ms) != 0 && millis() - id(g_off_ms) < ${meas_pause_s} * 1000UL))) return;
          if (desired != heater_on) {
            if (desired) id(heater).turn_on();
            else      id(heater).turn_off();
          }

  # Night mode. Sleep only if all conditions hold; otherwise stay awake
  # (a sleeping device is unreachable and does not measure).
  - interval: 5s
    then:
      - if:
          condition:
            and:
              - switch.is_on: auto_mode
              - switch.is_on: night_sleep_veto
              - switch.is_off: heater
              # Minimum wake time: first capacitance cycle and OTA window.
              - lambda: 'return millis() > ${sleep_wake_time};'
              - lambda: |-
                  float f_from = id(sleep_from).state;
                  float f_until = id(sleep_until).state;
                  if (isnan(f_from) || isnan(f_until)) return false;
                  int start_half = (int) roundf(f_from * 2);
                  int end_half = (int) roundf(f_until * 2);
                  if (start_half == end_half) return false;            // empty window

                  auto now_time = id(ha_time).now();
                  if (now_time.is_valid()) {
                    int h = now_time.hour * 2 + (now_time.minute >= 30 ? 1 : 0);
                    bool inside = (start_half < end_half) ? (h >= start_half && h < end_half)
                                            : ((h >= start_half) || (h < end_half));
                    id(g_night) = inside;
                    return inside;
                  }

                  // No valid clock (time comes from HA, so it fails with
                  // WiFi): after 2 min use the last known state, otherwise
                  // the device would stay awake all night and drain the
                  // battery.
                  return id(g_night) && millis() > 120000;
          then:
            - logger.log: "Night window, going to sleep"
            - deep_sleep.enter: night_sleep
