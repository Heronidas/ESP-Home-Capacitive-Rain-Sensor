blueprint:
  name: Regensensor outdoor air
  description: >
    Sends outdoor temperature and humidity to the Regensensor for the dew point.
    Fires on the first reading after each wake-up, so it also works in night mode.
  domain: automation
  source_url: https://github.com/Heronidas/esphome-capacitive-rain-sensor/blob/main/blueprints/regensensor_aussenluft.yaml
  input:
    trigger_sensor:
      name: Regensensor sensor
      description: Any sensor of the Regensensor that updates every few seconds, e.g. NTC Widerstand.
      selector:
        entity:
          filter:
            - domain: sensor
              integration: esphome
    outdoor_temperature:
      name: Outdoor temperature
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: temperature
    outdoor_humidity:
      name: Outdoor humidity
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: humidity
    node_name:
      name: ESPHome node name
      description: The name in the ESPHome YAML (substitution "name").
      default: regensensor
      selector:
        text:

mode: single
max_exceeded: silent

variables:
  t_entity: !input outdoor_temperature
  h_entity: !input outdoor_humidity
  node: !input node_name

triggers:
  - trigger: state
    entity_id: !input trigger_sensor

conditions:
  - condition: template
    value_template: "{{ is_number(states(t_entity)) and is_number(states(h_entity)) }}"

actions:
  - action: "esphome.{{ node }}_set_aussenluft"
    data:
      temperatur: "{{ states(t_entity) | float }}"
      feuchte: "{{ states(h_entity) | float }}"
  # Blocks re-triggering while the device is awake (about 35 s).
  - delay: 40
