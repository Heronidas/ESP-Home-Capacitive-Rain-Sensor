<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 290" font-family="DejaVu Sans, sans-serif" font-size="12">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <style>
    .box{fill:#f8fafc;stroke:#334155;stroke-width:1.4;rx:8}
    .acc{fill:#eef6ff;stroke:#1d4ed8;stroke-width:1.4}
    .t{font-weight:bold;font-size:13px;fill:#0f172a}
    .s{fill:#475569;font-size:11px}
    .w{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}
    .p{stroke:#b91c1c;stroke-width:1.8;fill:none;marker-end:url(#a)}
    .l{fill:#334155;font-size:11px}
    .lr{fill:#b91c1c;font-size:11px}
  </style>
  <!-- supply -->
  <rect class="box" x="10" y="115" width="110" height="70" rx="8"/>
  <text class="t" x="65" y="145" text-anchor="middle">5 V supply</text>
  <text class="s" x="65" y="163" text-anchor="middle">≥ 1.5 A</text>
  <!-- esp32 -->
  <rect class="box" x="180" y="20" width="190" height="110" rx="8"/>
  <text class="t" x="275" y="48" text-anchor="middle">ESP32 dev board</text>
  <text class="s" x="275" y="68" text-anchor="middle">USB for flashing</text>
  <text class="s" x="275" y="86" text-anchor="middle">3V3 regulator on board</text>
  <text class="s" x="275" y="104" text-anchor="middle">GPIO 13, 21, 22, 25, 34, 35</text>
  <!-- boost -->
  <rect class="box" x="180" y="180" width="190" height="90" rx="8"/>
  <text class="t" x="275" y="212" text-anchor="middle">Boost module</text>
  <text class="s" x="275" y="232" text-anchor="middle">XL6009</text>
  <text class="s" x="275" y="250" text-anchor="middle">set to 12.0 V</text>
  <!-- perfboard -->
  <rect class="acc" x="460" y="60" width="160" height="170" rx="8"/>
  <text class="t" x="540" y="92" text-anchor="middle">Perfboard</text>
  <text class="s" x="540" y="118" text-anchor="middle">74HC14 oscillator</text>
  <text class="s" x="540" y="138" text-anchor="middle">NTC divider</text>
  <text class="s" x="540" y="158" text-anchor="middle">MOSFET heater driver</text>
  <text class="s" x="540" y="178" text-anchor="middle">battery divider (opt.)</text>
  <text class="s" x="540" y="198" text-anchor="middle">screw terminals</text>
  <!-- sensor head -->
  <rect class="box" x="680" y="80" width="110" height="130" rx="8"/>
  <text class="t" x="735" y="112" text-anchor="middle">Sensor head</text>
  <text class="s" x="735" y="134" text-anchor="middle">RC-SPC1KA</text>
  <text class="s" x="735" y="152" text-anchor="middle">VEML7700</text>
  <text class="s" x="735" y="170" text-anchor="middle">(optional)</text>
  <!-- wires -->
  <path class="p" d="M120,140 H150 V75 H178"/>
  <path class="p" d="M150,140 V225 H178"/>
  <text class="lr" x="128" y="132">5 V</text>
  <path class="w" d="M370,75 H458"/>
  <text class="l" x="414" y="62" text-anchor="middle">3V3, GND,</text><text class="l" x="414" y="92" text-anchor="middle">GPIOs</text>
  <path class="p" d="M370,225 H415 V200 H458"/>
  <text class="lr" x="378" y="218">12 V</text>
  <path class="w" d="M620,145 H678"/>
  <text class="l" x="649" y="137" text-anchor="middle">8-core</text>
  <text class="l" x="649" y="163" text-anchor="middle">cable</text>
</svg>
